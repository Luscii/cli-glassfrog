# GoReleaser configuration for glassfrog. This file is the single source of
# build truth that a maintainer and CI both invoke, so the binaries cannot
# diverge.
#
# Ownership (additive, by spec):
#   - 021 Self-Contained Executable Build owns the `builds` block (four targets,
#     CGO_ENABLED=0). `builds.ldflags` is 023's version-injection seam — now
#     filled with the `-X internal/cli.version` stamp (Version Embedding).
#   - 022 Automated Release Pipeline owns the `archives`, `checksum`, and
#     `release` sections below — extending this file rather than introducing a
#     parallel packaging path.
#   - 036 Homebrew Tap owns the `brews` section at the foot of this file, plus
#     two refinements to 022's sections: `release.disable: true` (the strict
#     form of 022's `keep-existing`, so the tap job's `goreleaser release` never
#     touches the GitHub release) and a pinned `archives.builds_info.mtime` (so
#     the tap job's rebuilt archives are byte-reproducible and their sha256 sums
#     equal those of the published archives).
# 022 must not re-decide `builds`/`ldflags`; the config-guard (internal/build)
# pins both the matrix and the new sections against drift.
#
# Invocations:
#   goreleaser build   --snapshot --clean                  # four-target matrix → dist/
#   goreleaser build   --snapshot --clean --single-target  # host platform only — local dev build
#   goreleaser release --snapshot --clean --skip=publish   # build + archive + checksum → dist/ (no upload)
#   goreleaser release --clean --skip=publish              # CI build at the release tag (no upload)
# --snapshot builds without a git tag; every invocation applies this same
# config, so a local host binary and the matrix binary for that target are
# identical. Publishing is done by the workflow's `gh release upload` step, not
# by `goreleaser release` (see .github/workflows/release.yml).

version: 2
project_name: glassfrog

builds:
  - id: glassfrog
    # The module-root main package (main.go at the repository root).
    main: .
    binary: glassfrog
    # CGO_ENABLED=0 is the self-containment lever (CONSTITUTION XII): a pure-Go
    # binary with no C-library dependency, cross-compilable from any host.
    env:
      - CGO_ENABLED=0
    # goos × goarch yields exactly the four supported targets:
    # darwin/amd64, darwin/arm64, linux/amd64, linux/arm64. No windows.
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # -trimpath keeps builds path-independent and reproducible across hosts.
    flags:
      - -trimpath
    # Version Embedding (023): stamp the release version into the
    # internal/cli.version var at link time. `v{{ .Version }}` restores the `v`
    # prefix GoReleaser strips from .Version, matching the shape Go records in
    # build info (so --version reads as vX.Y.Z across release AND go-install
    # source builds); in --snapshot mode it yields a v-prefixed snapshot version
    # rather than a stale tag. This single -X flag also overrides GoReleaser's
    # default version flags, so only this var is injected (no commit/date — 003
    # keeps version output a bare string). The runtime fallback to build info is
    # in internal/cli (resolveVersion); a config-guard in internal/build asserts
    # this seam stays wired (a blanked ldflags or a drifted symbol path fails).
    ldflags:
      - "-X github.com/Luscii/cli-glassfrog/internal/cli.version=v{{ .Version }}"

# --- 022 Automated Release Pipeline: packaging + release sections ------------

# One tar.gz per build target. The name template carries tool/version/OS/arch
# so the four archives are unambiguous and downstream consumers (#27 install
# script, #36 Homebrew, #37 npm) can predict the asset names. {{ .Version }} is
# the tag without the leading `v` (e.g. tag v1.4.0 → glassfrog_1.4.0_darwin_arm64).
archives:
  - id: glassfrog
    ids:
      - glassfrog
    formats:
      - tar.gz
    name_template: "glassfrog_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # 036 refinement: pin the modification time of the files inside each archive
    # to the commit date so the tar.gz bytes are reproducible across jobs. The
    # Homebrew tap job rebuilds the archives at the release tag in a SEPARATE job
    # from the one that published them; the binary bytes are already
    # reproducible (-trimpath + CGO_ENABLED=0), but an unpinned tar-entry mtime
    # would still make the rebuilt archive's sha256 differ from the published
    # asset's and every `brew install` would fail its integrity check.
    # (GoReleaser pins the archive entry mtime via `builds_info.mtime`; this is
    # the realized form of the interface's "pin archives.mtime to the commit
    # date" — see internal/build config-guard and .score/memory/LEARNINGS.md.)
    builds_info:
      mtime: "{{ .CommitDate }}"

# A single sha256 checksums file over every archive — the integrity mechanism
# (no signing/notarization). One line per archive.
checksum:
  algorithm: sha256
  name_template: "glassfrog_{{ .Version }}_checksums.txt"

# 036 refinement (supersedes 022's `mode: keep-existing`): disable GoReleaser's
# GitHub-release publisher entirely. The Homebrew tap job runs `goreleaser
# release` to push the formula, and that invocation must NOT create or modify
# the GitHub release — asset attachment and the release body/status stay with
# 022's `gh release upload` and #30's drafting. `disable: true` is the strict
# form of `keep-existing`: rather than "keep an existing release's body", it
# means "never touch the GitHub release at all", which is exactly what the
# brew-publisher-only tap job (and any ad-hoc local `goreleaser release`) needs.
release:
  disable: true

# --- 036 Homebrew Tap: formula publisher -------------------------------------

# GoReleaser authors Formula/glassfrog.rb from the same archives + checksums 022
# produces, and (in the tap job, spec 036 Phase 3) pushes it to the dedicated
# tap repository. Rendering is offline: `goreleaser release --snapshot --clean
# --skip=publish` writes the formula into dist/ without tagging or pushing —
# the render-and-inspect test in internal/build drives exactly that.
brews:
  - name: glassfrog
    # Draw the formula's source artifacts from 021's `glassfrog` build's archives
    # (the same tar.gz set 022 publishes), so the per-platform url/sha256 the
    # formula records are derived from the published bytes.
    ids:
      - glassfrog
    # The dedicated tap repository (ADR-2). Publishing the formula here — not in
    # this repo — keeps the release flow off this repository's protected `main`.
    repository:
      owner: Luscii
      name: homebrew-cli-glassfrog
      branch: main
      # The cross-repo, least-privilege token (ADR-4). The default GITHUB_TOKEN
      # cannot push to another repository; this secret is injected ONLY in the
      # tap job's env (spec 036 Phase 3 / release.yml).
      # Templated via `index` (not `.Env.HOMEBREW_TAP_TOKEN`) so a missing key
      # renders as empty rather than erroring: the build job runs `goreleaser
      # release --skip=publish` WITHOUT this secret, and it must not fail there.
      # The token is only consumed by the brew push (the tap job), which still
      # fails loud on a genuinely missing/invalid token.
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    # The formula lands at Formula/glassfrog.rb in the tap repo.
    directory: Formula
    # With `release.disable: true` (above) GoReleaser cannot derive the formula's
    # download URLs from the GitHub-release config, so the asset URLs are pinned
    # explicitly. This is the interface's hard URL contract: each url points at an
    # asset 022 attached to THIS repo's release — {{ .Tag }} keeps the leading
    # `v`, {{ .ArtifactName }} is 022's `glassfrog_<ver>_<os>_<arch>.tar.gz`.
    url_template: "https://github.com/Luscii/cli-glassfrog/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/Luscii/cli-glassfrog"
    description: "Command-line surface over the Glassfrog Holacracy governance API (v5)."
    # SPDX license id for the formula (036 T002 — a LICENSE file is now at the
    # repo root). Set explicitly: GoReleaser does not populate brews.license from
    # the LICENSE file during an offline render, and `brew audit --strict`
    # requires a valid id.
    license: "MIT"
    # Install the pre-built binary — no compilation on the user's host (ADR-1).
    install: |
      bin.install "glassfrog"
    # A no-network smoke test: the `version` subcommand asserts the binary runs.
    test: |
      system "#{bin}/glassfrog", "version"
    # Pre-release gating is enforced at the workflow JOB level (the tap job's
    # `if: !github.event.release.prerelease`), not by `skip_upload: auto` — the
    # GitHub pre-release flag is authoritative, a semver `-rc` suffix is not.
    skip_upload: false
