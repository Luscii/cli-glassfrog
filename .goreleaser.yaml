# GoReleaser build configuration for glassfrog (spec 021 — Self-Contained
# Executable Build). This file is the single source of build truth that a
# maintainer and (later, 022) CI both invoke, so the binaries cannot diverge.
#
# Scope of 021: the `builds` block only. Archives, checksums, the GitHub
# release, and the Homebrew cask are owned by 022 (Automated Release Pipeline)
# and are deliberately absent — 022 extends this file additively rather than
# introducing a parallel build path.
#
# Invocations:
#   goreleaser build --snapshot --clean                  # full four-target matrix → dist/
#   goreleaser build --snapshot --clean --single-target  # host platform only — the local dev build
# --snapshot builds without a git tag; both invocations apply this same config,
# so a local host binary and the matrix binary for that target are identical.

version: 2
project_name: glassfrog

builds:
  - id: glassfrog
    # The module-root main package (main.go at the repository root).
    main: .
    binary: glassfrog
    # CGO_ENABLED=0 is the self-containment lever (CONSTITUTION XII): a pure-Go
    # binary with no C-library dependency, cross-compilable from any host.
    env:
      - CGO_ENABLED=0
    # goos × goarch yields exactly the four supported targets:
    # darwin/amd64, darwin/arm64, linux/amd64, linux/arm64. No windows.
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # -trimpath keeps builds path-independent and reproducible across hosts.
    flags:
      - -trimpath
    # Version Embedding (023): stamp the release version into the
    # internal/cli.version var at link time. `v{{ .Version }}` restores the `v`
    # prefix GoReleaser strips from .Version, matching the shape Go records in
    # build info (so --version reads as vX.Y.Z across release AND go-install
    # source builds); in --snapshot mode it yields a v-prefixed snapshot version
    # rather than a stale tag. This single -X flag also overrides GoReleaser's
    # default version flags, so only this var is injected (no commit/date — 003
    # keeps version output a bare string). The runtime fallback to build info is
    # in internal/cli (resolveVersion); a config-guard in internal/build asserts
    # this seam stays wired (a blanked ldflags or a drifted symbol path fails).
    ldflags:
      - "-X github.com/Luscii/cli-glassfrog/internal/cli.version=v{{ .Version }}"
