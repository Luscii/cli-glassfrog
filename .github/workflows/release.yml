# Automated Release Pipeline (spec 022).
#
# Triggered by *publishing* a GitHub Release — drafted by Release Drafting (#30)
# or created by hand — never by a raw tag push or a routine merge. On publish it
# builds the four supported platform binaries, packages each as a tar.gz, writes
# one sha256 checksums file, and attaches the whole set to the SAME release that
# triggered it. It honors the release's notes and pre-release/latest status: it
# adds artifacts, it does not author prose or decide status.
#
# Ownership boundaries:
#   - 021 owns the build matrix (.goreleaser.yaml `builds`); 023 owns the ldflags
#     version seam; #30 owns the release body/draft/status. 022 owns packaging,
#     the trigger, the cross-target verification gate, and the asset upload.
#   - GoReleaser does NOT publish here: `gh release upload --clobber` uploads the
#     exact, already-verified dist/ bytes and inherently preserves the release
#     body and status (GoReleaser OSS cannot resume-publish a pre-built dist/).
name: release

on:
  release:
    # Only a *published* release triggers the pipeline. A draft being saved or
    # updated, a tag push, or a merge to main does not match — so routine
    # activity never builds or attaches anything.
    types: [published]

# contents: write is the only privilege the pipeline needs (attach assets to a
# release in this repository). No external secrets. Note: this permission alone
# is not enough for `gh` — the publish job must also put the token in its env.
permissions:
  contents: write

jobs:
  # Build + package once, at the release tag, WITHOUT publishing. The produced
  # dist/ is uploaded as a CI artifact so the publish job attaches the exact
  # bytes that were built (verified-bytes = published-bytes). A failure of any
  # target here exits non-zero and aborts the whole run — nothing is attached.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history (not a shallow clone) so GoReleaser can derive the
          # version from the release tag the event points at.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned to the v2.16 line (spec 036): GoReleaser deprecated the `brews`
          # (formula) publisher in favour of `homebrew_casks`, but casks are
          # macOS-only and 036/ADR-1 needs a formula for Linux too. Stay on a
          # `brews`-supporting v2 and DO NOT bump past a release that removes it
          # without migrating the Homebrew channel (see .score/memory/DEPRECATION.md).
          version: "~> v2.16"
          # release (not build) so archives + checksums are produced; --skip=publish
          # keeps GoReleaser from creating/uploading anything — publish is the
          # `gh release upload` step below, gated on verification.
          args: release --clean --skip=publish
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          # The whole dist/: the four *.tar.gz, the checksums file, and
          # GoReleaser's metadata/build subdirectories (artifacts.json drives the
          # verify job's binary discovery).
          path: dist/
          retention-days: 1

  # Cross-target self-containment gate (spec 022 ADR-3). Fan out across the four
  # native-arch runners, one per build target. Each leg downloads the built
  # dist/, then runs 021's self-containment check (TestSelfContainment_HostBinary)
  # — which discovers its own target binary from dist/artifacts.json via the
  # runner's native GOOS/GOARCH, executes it (asserting exit 0), and inspects its
  # dynamic-library linkage against the per-platform OS-only allowlist. The
  # verified bytes are the published bytes (no rebuild). fail-fast surfaces the
  # first failing target; any leg failing keeps publish (which needs the whole
  # matrix) from running.
  #
  # Emulation fallback: where a native runner is unavailable (e.g. a hosted
  # linux/arm64 runner is not offered, or macOS minutes are constrained), run
  # that leg on a linux/amd64 runner under QEMU user-mode emulation — add a
  # `docker/setup-qemu-action` step and execute the target binary through the
  # registered interpreter. The linkage inspection (ldd) still applies; only the
  # execute probe runs emulated. Native runners are preferred (faster, no false
  # negatives from the emulator) and are used here.
  verify:
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      # Surface the first failing target immediately; one failing leg is enough
      # to abort the release, so there is no value in finishing the others.
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: darwin, goarch: amd64, runner: macos-15-intel }
          - { goos: darwin, goarch: arm64, runner: macos-14 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # actions/upload-artifact + download-artifact transport files through an
      # archive that does NOT preserve the Unix executable bit, so the downloaded
      # dist/ binaries come back non-executable and the execute probe in
      # TestSelfContainment_HostBinary fails with "permission denied". Re-apply the
      # exec bit the transport stripped BEFORE the probe. This does not touch the
      # published bytes (those are the *.tar.gz archives, which carry their own
      # internal perms); it only restores the on-disk mode of the loose binary so
      # it can be executed in place. The bytes verified stay byte-identical to the
      # shipped ones.
      - name: Restore executable bit on downloaded binaries
        run: find dist -type f -name glassfrog -exec chmod +x {} +
      # Runs on the leg's native arch, so HostBinary selects this target's binary
      # from dist/artifacts.json and verifies the shipped artifact (not a rebuild).
      - name: Verify ${{ matrix.goos }}/${{ matrix.goarch }} self-containment
        run: go test -run '^TestSelfContainment_HostBinary$' -v ./internal/build

  # Attach the verified dist/ to the triggering release. needs: [build, verify]
  # means publish runs ONLY if the build and EVERY verify matrix leg pass — a
  # build *or* self-containment failure aborts with nothing attached (atomic, no
  # partial release).
  publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    # gh authenticates from the GH_TOKEN/GITHUB_TOKEN env var, NOT from the
    # workflow `permissions` block alone — the token must be wired into the
    # step's environment or `gh release upload` fails with an auth error.
    #
    # GH_REPO is equally load-bearing and less obvious. This job deliberately
    # does NOT check out the repository (it only needs the dist/ artifact), so
    # there is no .git directory for gh to infer the target repo from — without
    # GH_REPO every gh invocation dies with "failed to run git: fatal: not a git
    # repository" before it ever reaches the API. Setting it at the job level
    # covers any future gh step here, and is cheaper than adding a checkout
    # purely to give gh its bearings.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Upload ONLY the release assets — the four archives then the checksums
      # file — to the triggering release. The globs deliberately exclude
      # GoReleaser's dist/ metadata (artifacts.json, metadata.json, config.yaml)
      # and the per-target build subdirectories; a bare dist/* would attach junk
      # assets or fail on a directory. Archives are listed before the checksums
      # glob so the checksums file uploads last — its presence on the release is
      # the completeness signal for consumers. --clobber makes the step
      # idempotent: re-running (or recovering from a partial mid-upload failure)
      # converges on one asset set with no duplicates. The upload touches assets
      # only — the release body and pre-release/latest status are left untouched.
      - name: Attach archives and checksums to the release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.tar.gz dist/*checksums.txt \
            --clobber

  # Homebrew tap publisher (spec 036). Runs only after a STABLE release is fully
  # published. It rebuilds the archives at the release tag — reproducibly, via
  # the pinned archives.builds_info.mtime, so the rebuilt sha256 equal the
  # published ones — and runs GoReleaser's brew publisher to push
  # Formula/glassfrog.rb to the dedicated tap repo (Luscii/homebrew-cli-glassfrog).
  # It must NOT create or modify the GitHub release: release.disable: true in
  # .goreleaser.yaml keeps `goreleaser release` to the brew publisher only, so
  # asset attachment and release status stay with the publish job above and #30.
  tap:
    needs: [publish]
    # Authoritative stable-only gate (spec 036): key off GitHub's pre-release
    # flag, NOT GoReleaser's skip_upload: auto (which keys off a semver suffix
    # that can diverge from the flag). A pre-release skips this job entirely, so
    # the tap formula keeps pointing at the latest stable release.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # The cross-repo write token (ADR-4). The default GITHUB_TOKEN cannot push to
    # another repository; the CI_GITHUB_TOKEN org secret carries contents: write
    # on the tap repo. Injected ONLY here, under the exact name the
    # brews.repository.token template reads ({{ index .Env "HOMEBREW_TAP_TOKEN" }}).
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history at the release tag so GoReleaser derives the same
          # version the publish job built.
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          # Same brews-supporting pin as the build job (see its note).
          version: "~> v2.16"
          # Run the brew publisher: build + archive (reproducibly) + push the
          # formula. NO --skip=publish — that would skip the push, which is the
          # whole point. The GitHub release is left untouched (release.disable).
          args: release --clean

  # --- 037 NPM Wrapper Package: publish the npm acquisition channel ------------
  #
  # Owned by spec 037 (additive to 022's release.yml, mirroring .goreleaser.yaml's
  # per-spec sections). needs: [build, verify] means npm publishes ONLY after the
  # build and EVERY self-containment leg pass — no npm release without a verified
  # release. It reuses the SAME verified dist/ artifact (byte-parity: the bytes the
  # matrix gated are the bytes npm publishes), runs the generator at the release
  # version, and publishes platform packages FIRST, then the umbrella — so the
  # umbrella's pinned optionalDependencies already exist on the registry.
  #
  # Auth is GitHub OIDC trusted publishing (id-token: write; no stored NPM_TOKEN):
  # each of the five package names must be registered as a trusted publisher on
  # npmjs.com once before the first release (a maintainer ops step — see the README
  # npm Installation section / scripts/npm-trusted-publishers.md). Trusted
  # publishing also attaches provenance automatically (--provenance is explicit).
  npm-publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for npm trusted publishing — the ONLY privilege this job adds
      # over the workflow default, scoped to this job alone.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (tokenless OIDC) needs npm >= 11.5.1; pin to a recent
      # npm so the runner's bundled version cannot regress the publish path.
      - name: Ensure a trusted-publishing-capable npm
        run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Generate the umbrella + four platform package directories from the verified
      # dist/ binaries at the release version (tag minus the leading v).
      - name: Generate npm packages
        run: node npm/build.mjs --version "${{ github.event.release.tag_name }}" --dist dist --out dist/npm
      # Publish platform packages FIRST, then the umbrella. The glassfrog-* glob
      # excludes the hyphen-less umbrella dir (dist/npm/glassfrog), which publishes
      # last so its pinned optional deps already resolve.
      - name: Publish platform packages, then the umbrella
        run: |
          for pkg in dist/npm/glassfrog-*; do
            echo "Publishing $pkg"
            npm publish "$pkg" --access public --provenance
          done
          echo "Publishing the umbrella"
          npm publish dist/npm/glassfrog --access public --provenance
