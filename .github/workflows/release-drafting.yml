# Release Drafting (spec 030).
#
# On every merge to main, keep a single draft GitHub Release current: the next
# semantic version (resolved highest-wins from the 028 PR labels, default patch)
# and the merged-PR titles grouped into the seven release-note categories. The
# config lives in .github/release-drafter.yml. This workflow NEVER publishes —
# the draft waits for a maintainer to publish it, and that act triggers the
# Automated Release Pipeline (022, release.yml).
#
# Deliberately a SEPARATE workflow from main-verify.yml (029), which is also on
# push:main but scoped contents:read/tests-only (ADR-1). Drafting needs
# contents:write to maintain the release, so it gets its own least-privilege
# file. It is NOT a required status check — it runs after the merge and gates
# nothing; a drafting failure leaves the previous draft intact (spec §Non-Blocking).
name: Release Drafting

on:
  push:
    branches: [main]   # NOT tags — 022 owns the published-tag trigger.

# Least privilege: write the draft release + read merged-PR labels/titles.
permissions:
  contents: write
  pull-requests: read

# Latest tip wins: a newer merge supersedes an in-flight draft run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      # No actions/checkout: release-drafter reads merged-PR metadata via the
      # API, and the workflow runs on trusted main (not an untrusted PR head).
      # Pinned to a concrete release (NOT a floating major), matching 022/024/028
      # pin-the-toolchain discipline so an upstream release can't silently change
      # drafting behaviour.
      - name: Draft the next release
        id: draft
        # Pinned to an exact patch on the v7 line — the major that reads
        # release-drafter.yml's schema (071). internal/build/drafterschema.go
        # holds this pinned major at or above the schema's floor, so the config
        # and the action cannot drift apart silently again. Majors still move by
        # hand only: an ignore rule in .github/dependabot.yml blocks automated
        # major bumps for this action, and this bump was made under that
        # procedure.
        #
        # Empirical record from the v6 pin-back (kept because it is why the
        # post-merge pre-release observation below is expected): when v7.7.0 was
        # merged automatically on 2026-08-03, the very next drafted release came
        # out with NO TAG — GitHub substituted the placeholder
        # `untagged-1b38099d29f3144567d9`, which is not semver, so the release
        # pipeline died at `goreleaser ... parsing tag`. The fingerprint is the
        # release payload's `target_commitish`, which v6 sets to
        # `refs/heads/main` and v7 sets to `main` — v0.1.0/v0.2.0/v0.2.1 all
        # carry the former and a correct tag; v0.2.2 carried the latter and no
        # tag. The tag loss is NOT documented as a v7 breaking change, and the
        # schema migration is NOT known to fix it — v6 tagged correctly 3/3, v7
        # failed 1/1. Per dependabot.yml's hand-bump procedure, the first
        # post-merge drafting run and a throwaway pre-release are the
        # observation points for that failure mode.
        uses: release-drafter/release-drafter@v7.7.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # ADR-5: status follows the version — pre-release while 0.x, latest at
      # >=1.0.0. Addressed by the release ID (steps.draft.outputs.id), not the
      # tag: a draft has no real git tag yet, so `gh release edit <tag>` /
      # `gh release view <tag>` 404 on drafts (the releases/tags/{tag} endpoint
      # only finds PUBLISHED releases). PATCH-by-id via the API is the reliable
      # handle for an unpublished draft. The interface marked the exact
      # invocation [ASSUMED]; this realizes ADR-5's intent with the by-id form.
      - name: Set pre-release/latest from version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Quote-and-default the output. Unquoted it expanded to nothing on
          # 2026-08-03 (`if [ "" = "0" ]`, run 30818896444, most likely a race
          # between six rapid merges under cancel-in-progress), which silently
          # took the else branch and PATCHed make_latest=true on a DRAFT — always
          # a 422 ("Latest release cannot be draft or prerelease"). Defaulting an
          # unresolved major to "0" fails safe: a 0.x release is a pre-release
          # under ADR-2 anyway, so the safe branch is also the correct one.
          MAJOR="${{ steps.draft.outputs.major_version }}"
          if [ "${MAJOR:-0}" = "0" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/releases/${{ steps.draft.outputs.id }}" \
              -F prerelease=true -F make_latest=false
          else
            gh api -X PATCH "repos/${{ github.repository }}/releases/${{ steps.draft.outputs.id }}" \
              -F prerelease=false -F make_latest=true
          fi
