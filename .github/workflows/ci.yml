# PR Validation (spec 024).
#
# The pre-merge gate. Runs on every pull request whose base is main and blocks
# the merge until lint and the full test suite pass. It is the upstream
# guarantee the Automated Release Pipeline (022) assumes: `go test ./...` runs
# the internal/build .goreleaser.yaml config-guard test, so .goreleaser.yaml
# drift fails here before a release is ever cut. Main-Branch Verification (029)
# re-runs the same suite on push to main as the post-merge net.
#
# Ownership boundaries:
#   - This workflow owns the pre-merge gate (lint + test matrix + the stable
#     ci-success status). It adds NO Go package, NO cobra command, and NO test
#     — it orchestrates the suite the repo already has.
#   - The one part of the gate that cannot live in a committed file is the
#     branch-protection rule that makes ci-success required on main (GitHub repo
#     settings). It is applied once by a maintainer — see
#     scripts/setup-branch-protection.sh.
name: CI

# The default pull_request activity types are opened / synchronize / reopened —
# exactly the spec's three triggers, so no explicit `types:` is needed.
# `synchronize` fires on every push to the PR head, so "push a fix re-runs the
# gate" needs no extra wiring. `branches: [main]` scopes to PRs whose BASE is
# main; a PR targeting any other base does not match and so does not run.
on:
  pull_request:
    branches: [main]

# Least privilege: the gate builds and tests, it never writes. `contents: read`
# is all it needs, so fork PRs validate identically under the default read-only
# token. No secrets.
permissions:
  contents: read

# Latest-commit semantics: key the concurrency group on the PR so a new push
# cancels the superseded in-flight run. The gate therefore always reflects the
# latest head commit, and a superseded run cannot satisfy it — its cancelled
# jobs leave ci-success non-success (see the ci-success guard below).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Lint runs ONCE per validation run (ADR-2) — not per test-matrix cell, since
  # these checks are OS-independent. Four legible categories: a gofmt
  # formatting check, `go vet`, the configured aggregate linter (golangci-lint,
  # driven by .golangci.yml), and a `shellcheck` pass over the install script
  # (spec 027). golangci-lint already bundles gofmt/govet, but running them
  # explicitly keeps each failure category readable and gives a fast,
  # dependency-light signal. shellcheck is scoped to install.sh (the one shell
  # artifact the project ships) and does not touch golangci-lint's Go scope.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        # `gofmt -l` lists files that are not gofmt-clean; any output means the
        # step fails, naming the offending files.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to a concrete golangci-lint release compatible with the
          # go.mod Go version (NOT `latest`) so a new upstream release cannot
          # redden an unrelated PR. Bumping it is a deliberate, reviewable PR
          # that itself runs through this gate. See .golangci.yml for the
          # enabled-linter policy.
          version: v2.11.4
      - name: shellcheck (install.sh)
        # The installer (spec 027) targets POSIX `sh` (ADR-1), so it is checked
        # with the `sh` dialect — this catches bashisms (arrays, [[ ]], ==,
        # pipefail) that would break on dash/busybox hosts piped `curl … | sh`.
        # shellcheck is pre-installed on ubuntu-latest, so no extra action or
        # token is needed (fork-safe under the job's read-only permissions).
        # Any finding fails the step.
        run: shellcheck --shell=sh install.sh

  # The OS test matrix lives in the shared reusable workflow (spec 029, ADR-1):
  # both this pre-merge gate (024) and the post-merge net (main-verify.yml, 029)
  # call test.yml, so the matrix and the plain `go test ./...` invocation exist
  # in exactly one place and cannot silently drift. The cell checks now display
  # nested as `test / test (ubuntu-latest)`; ci-success still aggregates the
  # called workflow's result (success iff every cell passed), and branch
  # protection requires only the stable ci-success name — never the cell names —
  # so the required gate is unaffected by the nesting.
  test:
    uses: ./.github/workflows/test.yml

  # The single stable required status check (ADR-4). A matrix `test` job
  # publishes one check PER cell (test (ubuntu-latest), test (macos-latest)),
  # and those names drift whenever the matrix changes — so branch protection
  # requires ONLY this aggregating context, never the cell contexts. The matrix
  # can grow or shrink underneath without touching the protection rule.
  #
  # `if: always()` makes this job run even when a dependency failed or was
  # cancelled, so it fails LOUDLY rather than being skipped (a skipped required
  # check would leave the gate unmet but unexplained).
  ci-success:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        # needs.test.result aggregates the WHOLE matrix: it is "success" only
        # when every cell succeeded, and "failure"/"cancelled" otherwise. So a
        # failed cell, or a superseded (cancelled) run, fails this gate and can
        # never silently satisfy it.
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed (lint=${{ needs.lint.result }}, test=${{ needs.test.result }})."
            exit 1
          fi
          echo "All required jobs succeeded."
