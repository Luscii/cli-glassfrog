# PR Validation (spec 024).
#
# The pre-merge gate. Runs on every pull request whose base is main and blocks
# the merge until lint and the full test suite pass. It is the upstream
# guarantee the Automated Release Pipeline (022) assumes: `go test ./...` runs
# the internal/build .goreleaser.yaml config-guard test, so .goreleaser.yaml
# drift fails here before a release is ever cut. Main-Branch Verification (029)
# re-runs the same suite on push to main as the post-merge net.
#
# Ownership boundaries:
#   - This workflow owns the pre-merge gate (lint + test matrix + the stable
#     ci-success status). It adds NO Go package, NO cobra command, and NO test
#     — it orchestrates the suite the repo already has.
#   - The one part of the gate that cannot live in a committed file is the
#     branch-protection rule that makes ci-success required on main (GitHub repo
#     settings). It is applied once by a maintainer — see
#     scripts/setup-branch-protection.sh.
name: CI

# The default pull_request activity types are opened / synchronize / reopened —
# exactly the spec's three triggers, so no explicit `types:` is needed.
# `synchronize` fires on every push to the PR head, so "push a fix re-runs the
# gate" needs no extra wiring. `branches: [main]` scopes to PRs whose BASE is
# main; a PR targeting any other base does not match and so does not run.
on:
  pull_request:
    branches: [main]

# Least privilege: the gate builds and tests, it never writes. `contents: read`
# is all it needs, so fork PRs validate identically under the default read-only
# token. No secrets.
permissions:
  contents: read

# Latest-commit semantics: key the concurrency group on the PR so a new push
# cancels the superseded in-flight run. The gate therefore always reflects the
# latest head commit, and a superseded run cannot satisfy it — its cancelled
# jobs leave ci-success non-success (see the ci-success guard below).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Lint runs ONCE per validation run (ADR-2) — not per test-matrix cell, since
  # these checks are OS-independent. Three legible categories: a gofmt
  # formatting check, `go vet`, and the configured aggregate linter
  # (golangci-lint, driven by .golangci.yml). golangci-lint already bundles
  # gofmt/govet, but running them explicitly keeps each failure category
  # readable and gives a fast, dependency-light signal.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        # `gofmt -l` lists files that are not gofmt-clean; any output means the
        # step fails, naming the offending files.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to a concrete golangci-lint release compatible with the
          # go.mod Go version (NOT `latest`) so a new upstream release cannot
          # redden an unrelated PR. Bumping it is a deliberate, reviewable PR
          # that itself runs through this gate. See .golangci.yml for the
          # enabled-linter policy.
          version: v2.11.4

  # Tests run across an OS matrix (ADR-3): ubuntu + macos, the two families the
  # tool ships to — exercising the OS-divergent paths that matter for this
  # codebase (internal/build inspects linkage with otool on darwin vs ldd on
  # linux; golang.org/x/term has per-OS paths). amd64 + single go.mod-pinned Go
  # version keeps per-PR cost bounded; cross-arch breadth stays at release time
  # (022). The matrix extends by adding axis values without restructuring — the
  # ci-success gate keeps the required-check name stable when it does.
  #
  # `go test ./...` is kept a plain, flag-free invocation so Main-Branch
  # Verification (029) can mirror it directly. It exercises the existing unit
  # tests, every godog BDD suite, the internal/build host self-containment test,
  # and the internal/build .goreleaser.yaml config-guard test the release
  # pipeline (022) relies on. No new test logic is added here.
  test:
    strategy:
      # Every cell must pass. fail-fast: false lets one OS finish and report
      # even when the other fails, so the failing OS is identifiable by its
      # cell name (e.g. `test (macos-latest)`).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test ./...
