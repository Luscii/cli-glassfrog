        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createRoleNote
      summary: "Create a note on a role"
      description: |
        Creates a new note on the specified role. The creator is tracked via
        the API key's associated person.

        **Agent token restriction:** Agent-actor tokens cannot set
        `permissions.view` to `public` (returns 403). Only human-held
        tokens may set public visibility.
      parameters:
        - name: role_id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '201':
          description: The created note.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /notes:
    get:
      operationId: listNotes
      summary: List notes across the organization
      description: |
        Returns a paginated list of notes across the whole organization,
        filtered per `RoleNotePolicy` visibility. Supports filters by title
        substring, role, and a full-text-ish query that matches title or body.
      parameters:
        - name: title
          in: query
          required: false
          description: Case-insensitive substring match on note title.
          schema:
            type: string
        - name: role_id
          in: query
          required: false
          description: |
            Limit to notes on this role. When present, matches the behavior of
            `GET /roles/{role_id}/notes`.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - name: query
          in: query
          required: false
          description: |
            Case-insensitive substring match across title and body.
          schema:
            type: string
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A paginated list of notes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notes/{id}:
    get:
      operationId: getNote
      summary: "Get a note"
      description: Returns a single note by ID, including the full markdown body.
      parameters:
        - name: id
          in: path
          required: true
          description: The note's unique identifier.
          schema:
            type: string
            pattern: '^rnot_[0-9a-f]{32}$'
      responses:
        '200':
          description: A single note with full content.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateNote
      summary: "Update a note"
      description: |
        Updates the title and/or body of an existing note.

        Supports optimistic concurrency via `If-Match`. When present, the
        update only proceeds if the ETag matches the current resource state.
        Omit `If-Match` for unconditional (last-write-wins) updates.

        **Agent token restriction:** Agent-actor tokens cannot set
        `permissions.view` to `public` (returns 403). Only human-held
        tokens may set public visibility.
      parameters:
        - name: id
          in: path
          required: true
          description: The note's unique identifier.
          schema:
            type: string
            pattern: '^rnot_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '200':
          description: The updated note.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteNote
      summary: "Delete a note"
      description: Soft-deletes a note. The note is no longer visible but retained in the database.
      parameters:
        - name: id
          in: path
          required: true
          description: The note's unique identifier.
          schema:
            type: string
            pattern: '^rnot_[0-9a-f]{32}$'
      responses:
        '204':
          description: Note deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles/{role_id}/projects:
    get:
      operationId: listRoleProjects
      summary: "List projects for a role"
      description: |
        Returns a paginated list of projects owned by a role. Use `?status=`
        to filter by project status.

        Use `?include=sub_projects,actions` to embed related resources
        on each project in the response. Same lateral-join mechanism as the
        detail endpoint — runs per row, so large result sets with includes
        may be slower.
      parameters:
        - name: role_id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Q'
        - name: status
          in: query
          description: Filter by project status.
          schema:
            type: string
            enum:
              - archived
              - cancelled
              - completed
              - current
              - scheduled
              - someday
              - waiting
        - name: tag
          in: query
          description: Filter projects by tag name (case-insensitive).
          schema:
            type: string
            example: marketing
        - name: include
          in: query
          description: |
            Comma-separated list of related resources to include on each
            project. Unknown values are silently ignored.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - sub_projects
                - actions
      responses:
        '200':
          description: A paginated list of projects.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createRoleProject
      summary: "Create a project on a role"
      description: |
        Creates a new project owned by the specified role. The creator is
        assigned as the person on the project.
      parameters:
        - name: role_id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: The created project.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /projects/{project_id}/actions:
