          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          description: Filter by tension status.
          schema:
            type: string
