openapi: 3.0.3
info:
  title: GlassFrog API v5 (Beta)
  description: |
    The GlassFrog API v5 provides programmatic access to your organization's
    Holacracy structure — roles, accountabilities, domains, assignments, and more.

    > **⚠️ Beta Notice:** This API is in beta. Breaking changes may occur.
    > Check release notes in the API documentation for updates.

    ## Authentication

    All requests require an API v5 key passed via the `X-Auth-Token` header.
    API v5 keys are distinct from v3 keys and must be generated separately.

    ```
    X-Auth-Token: your_v5_api_key_here
    ```

    Each API key is scoped to a single organization and person; permissions
    follow the caller's membership in that organization.

    ## Pagination

    List endpoints return cursor-based pagination. Use `per_page` (max 500,
    default 100) and `after` (cursor from previous response) to page through results.

    Values above the maximum return `400 Bad Request` with a `message` explaining the
    limit — callers should not assume the server silently clamped. Blank, zero, negative,
    or non-numeric values fall back to the default of 100.

    ```json
    {
      "data": [...],
      "meta": {
        "pagination": {
          "per_page": 100,
          "has_next_page": true,
          "next_cursor": "role_abc123..."
        }
      }
    }
    ```

    ## Includes

    Detail endpoints support `?include=` to embed related resources.
    Pass a comma-separated list of valid include names.

    ## Optimistic Concurrency (ETags)

    GET responses for mutable resources include an `ETag` header — a hash of the
    resource's current state. To prevent stale writes, send the ETag back on
    PUT/PATCH via the `If-Match` header:

    ```
    GET /api/v5/notes/rnot_abc123
    → ETag: "a1b2c3..."

    PATCH /api/v5/notes/rnot_abc123
    If-Match: "a1b2c3..."
    → 200 OK          (ETag matched — write accepted)
    → 409 Conflict     (resource changed since your read — re-fetch and retry)
    ```

    If `If-Match` is omitted, the update proceeds unconditionally (last-write-wins).
    This keeps it simple for consumers who don't need concurrency protection.

    ## Errors

    Errors follow the RFC 9457 Problem Details shape (the backward-compatible
    2023 successor to RFC 7807) and are served with
    `Content-Type: application/problem+json`:

    ```json
    {
      "type": "about:blank",
      "title": "Not Found",
      "status": 404,
      "detail": "Not Found"
    }
    ```

    `type`, `title`, `status`, and `detail` are always present. Additional
    members ("extensions" in RFC 9457 terms) may appear alongside them.

    ## Rate Limiting

    API requests are rate-limited per organization on a rolling 1-hour window.
    Limits depend on your plan:

    | Plan | Limit |
    |------|-------|
    | Free / Restricted | 50 requests / hour |
    | Premium | `member_count × 500` requests / hour |

    Every response includes rate limit headers:

    | Header | Description |
    |--------|-------------|
    | `X-RateLimit-Limit` | Maximum requests allowed in the current window |
    | `X-RateLimit-Remaining` | Requests remaining in the current window |
    | `X-RateLimit-Reset` | Unix epoch timestamp when the window resets |

    When the limit is exceeded, the API returns `429 Too Many Requests` with a
    `Retry-After` header and an RFC 9457 Problem Details body:

    ```json
    {
      "type": "about:blank",
      "title": "Too Many Requests",
      "status": 429,
      "detail": "Rate limit exceeded. Try again in 42 seconds."
    }
    ```

  version: 5.0.0
  contact:
    name: GlassFrog Support
    url: https://glassfrog.com
  license:
    name: Proprietary

servers:
  - url: /api/v5
    description: GlassFrog API v5

security:
  - ApiKeyAuth: []

paths:
  /roles:
    get:
      operationId: listRoles
      summary: "List roles"
      description: |
        Returns a paginated list of roles in the organization. Each role includes
        its accountabilities, domains, fillers, and flags inline. Use filters to
        narrow results by parent role or assigned person.
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Q'
        - name: parent_role_id
          in: query
          description: Filter to roles within a specific parent role.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - name: person_id
          in: query
          description: Filter to roles assigned to a specific person.
          schema:
            type: string
            pattern: '^(per|agt)_[0-9a-f]{32}$'
        - name: has_subroles
          in: query
          description: |
            Filter by whether a role has sub-roles. `true` returns only roles
            with sub-roles; `false` returns only leaf roles. Omit to
            return all roles.
          schema:
            type: boolean
        - name: tag
          in: query
          description: Filter roles by tag name (case-insensitive).
          schema:
            type: string
            example: marketing
      responses:
        '200':
          description: A paginated list of roles.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles/{id}:
    get:
      operationId: getRole
      summary: "Get a role"
      description: |
        Returns a single role by its ID. Use `?include=` to embed related
        resources such as assignments, sub-roles, parent role, policies, or notes.
      parameters:
        - name: id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - name: include
          in: query
          description: |
            Comma-separated list of related resources to include.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - assignments
                - subroles
                - parent_role
                - policies
                - notes
                - skills
      responses:
        '200':
          description: A single role.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/RoleDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles/{id}/subroles:
    get:
      operationId: listSubroles
      summary: "List subroles"
      description: |
        Returns the immediate child roles of a role (its subroles).
        For leaf roles with no subroles, returns an empty array.

        Navigate the org hierarchy by walking this tree:
        ```
        GET /roles                          → top-level roles
        GET /roles/:id/subroles            → what's inside this role
        GET /roles/:id/subroles?include=subroles  → two levels deep
        ```
      parameters:
        - name: id
          in: path
          required: true
          description: The parent role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Q'
        - name: include
          in: query
          description: |
            Comma-separated list of related resources to include on each sub-role.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - assignments
                - subroles
                - parent_role
                - policies
                - notes
                - skills
      responses:
        '200':
          description: A paginated list of child roles.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles/{id}/subroles/actors:
    get:
      operationId: listSubrolesActors
      summary: "List actors filling a role's subroles"
      description: |
        Returns actors (humans and agents) filling any direct sub-role of this
        role. One level of nesting. Cross-linked assignments are excluded.

        Only available on expanded roles (where `has_subroles` is `true`).
        Leaf roles return 404. Same response shape as `GET /actors`.

        Use `?kind=human` to filter to human actors only, or use the
        `/roles/{id}/subroles/people` alias.
      parameters:
        - name: id
          in: path
          required: true
          description: The anchor role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - name: kind
          in: query
          description: Filter by actor kind.
          schema:
            type: string
            enum:
              - human
              - agent
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A paginated list of subrole actors.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Actor'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles/{id}/subroles/people:
    get:
      operationId: listSubrolesPeople
      summary: "List people filling a role's subroles"
      description: |
        Alias for `GET /roles/{id}/subroles/actors?kind=human`. Returns only
        human actors (people) filling any direct sub-role of this role.

        Only available on expanded roles (where `has_subroles` is `true`).
        Leaf roles return 404. Same response shape as `GET /actors`.
      parameters:
        - name: id
          in: path
          required: true
          description: The anchor role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A paginated list of people filling subroles.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Actor'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles/{id}/subroles/projects:
    get:
      operationId: listSubrolesProjects
      summary: "List projects rolled up across a role's subroles"
      description: |
        Returns projects owned by any direct sub-role of this role. Same
        response shape as `GET /roles/:id/projects`. One level of nesting.

        Only available on expanded roles (where `has_subroles` is `true`).
        Leaf roles return 404.
      parameters:
        - name: id
          in: path
          required: true
          description: The anchor role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          description: Filter by project status.
          schema:
            type: string
            enum:
              - archived
              - cancelled
              - completed
              - current
              - scheduled
              - someday
              - waiting
      responses:
        '200':
          description: A paginated list of projects.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles/{id}/subroles/actions:
    get:
      operationId: listSubrolesActions
      summary: "List actions rolled up across a role's subroles"
      description: |
        Returns actions owned by any direct sub-role of this role. Same
        response shape as `GET /roles/:id/actions`. One level of nesting.

        Only available on expanded roles (where `has_subroles` is `true`).
        Leaf roles return 404.
      parameters:
        - name: id
          in: path
          required: true
          description: The anchor role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          description: Filter by action status.
          schema:
            type: string
            enum:
              - archived
              - cancelled
              - completed
              - current
              - scheduled
              - someday
              - waiting
      responses:
        '200':
          description: A paginated list of actions.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Action'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /roles/{id}/subroles/policies:
    get:
      operationId: listSubrolesPolicies
      summary: "List policies rolled up across a role's subroles"
      description: |
        Returns policies attached to any direct sub-role of this role. Same
        response shape as `GET /roles/:id/policies`. One level of nesting.

        Only available on expanded roles (where `has_subroles` is `true`).
        Leaf roles return 404.
      parameters:
        - name: id
          in: path
          required: true
          description: The anchor role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A paginated list of policies.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Policy'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles/{id}/tree:
    get:
      operationId: getRoleTree
      summary: "Get the full subtree rooted at a role"
      description: |
        Returns the complete role hierarchy below (and including) the
        requested root role, as a single nested tree node. Useful for org-chart
        rendering and for agents orienting to a branch of the organization in
        one call.

        The per-node shape is "light" by default (id, name, purpose,
        parent_role_id, has_subroles, flags, children). Use `?include=` to
        add `accountabilities`, `domains`, and/or `members` (fillers) to every
        node. Policies, notes, and skills — which are often large —
        are not offered as tree-level includes; fetch them via `/roles/{id}`
        for a specific role.

        **Recursion is intentional** and the whole point of this endpoint,
        in contrast to `/roles/{id}/subroles` which returns only direct
        children.

        **Pagination:** not supported. GlassFrog organizations are small
        enough (typically 100–500 roles) that returning the full tree in one
        response is the simpler and more useful design. Use `?depth=` when
        you need to bound response size.

        **Caching:** responses carry an `ETag` header whose fingerprint
        combines the maximum `updated_at` across the subtree with the
        requester's authorization digest. Send `If-None-Match` on subsequent
        requests to receive a `304 Not Modified` when nothing visible has
        changed.
      parameters:
        - name: id
          in: path
          required: true
          description: The root role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - name: depth
          in: query
          description: |
            Maximum depth of descendants to return. `0` returns the root
            node alone with no children; `1` returns the root plus its
            direct children; and so on. Omit for the full subtree.
          schema:
            type: integer
            minimum: 0
          example: 3
        - name: include
          in: query
          description: |
            Comma-separated list of extra per-node fields. Unknown values are
            silently ignored.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - accountabilities
                - domains
                - members
      responses:
        '200':
          description: The full subtree rooted at the requested role.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/TreeNode'
        '304':
          description: Not Modified. The client's `If-None-Match` matches the current fingerprint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tree:
    get:
      operationId: getOrgTree
      summary: "Get the full organizational tree"
      description: |
        Convenience alias for `GET /roles/{id}/tree` with the requester's
        organization's anchor role as the root — i.e., "the whole org". All
        query parameters and response semantics match `/roles/{id}/tree`.
      parameters:
        - name: depth
          in: query
          description: |
            Maximum depth of descendants to return. `0` returns the root
            node alone; `1` returns root plus direct children; and so on.
            Omit for the full subtree.
          schema:
            type: integer
            minimum: 0
        - name: include
          in: query
          description: |
            Comma-separated list of extra per-node fields to include on
            each tree node: `accountabilities`, `domains`, `members`.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - accountabilities
                - domains
                - members
      responses:
        '200':
          description: The full org tree rooted at the anchor role.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/TreeNode'
        '304':
          description: Not Modified. The client's `If-None-Match` matches the current fingerprint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles/{id}/context:
    get:
      operationId: getRoleContext
      summary: "Get role context"
      description: |
        Returns everything an agent (or person) needs to fill a role — structured
        organizational context in a single API call. The response is a hypermedia
        document: full content for critical items (identity, role definition, skills),
        indexes with API links for everything else (policies, notes, projects).

        **Progressive disclosure:** Indexed items include a `url` field pointing to
        the full-detail API endpoint. Call those endpoints for complete content.

        **Agent identity:** The `agent` section is only present when the API key
        belongs to an agent-kind actor. Human actors receive all other sections.
      parameters:
        - name: id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
      responses:
        '200':
          description: The full context for filling this role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /actors:
    get:
      operationId: listActors
      summary: "List actors"
      description: |
        Returns a paginated list of actors (humans and agents) in the organization.
        Use `?kind=` to filter by type. The `/people` and `/agents` aliases apply
        the kind filter automatically.
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Q'
        - name: kind
          in: query
          description: Filter by actor type.
          schema:
            type: string
            enum:
              - human
              - agent
        - name: role_id
          in: query
          description: Filter to actors filling a specific role.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
      responses:
        '200':
          description: A paginated list of actors.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Actor'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createActor
      summary: "Invite a person to the organization"
      description: |
        Creates a new person and membership in the organization (or adds an existing
        person by email). Sends an invitation email. Requires org admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '201':
          description: The created actor.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Actor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /actors/{id}:
    get:
      operationId: getActor
      summary: "Get an actor"
      description: |
        Returns a single actor by ID. Accepts both `per_` (human) and `agt_` (agent)
        prefixed IDs. Use `?include=` to embed roles or assignments.
      parameters:
        - name: id
          in: path
          required: true
          description: The actor's unique identifier (per_ or agt_ prefix).
          schema:
            type: string
            pattern: '^(per|agt)_[0-9a-f]{32}$'
        - name: include
          in: query
          description: Comma-separated list of related resources to include.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - roles
                - assignments
      responses:
        '200':
          description: A single actor.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Actor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateActor
      summary: "Update a person"
      description: |
        Updates a person's name, email, or admin status. Org admins can update
        any member; non-admins can only update themselves.
      parameters:
        - name: id
          in: path
          required: true
          description: The actor's unique identifier (per_ or agt_ prefix).
          schema:
            type: string
            pattern: '^(per|agt)_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '200':
          description: The updated actor.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Actor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
