            role's definition, governance context, and org skills index.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
      responses:
        '200':
          description: Agent identity context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentContextResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

