                    $ref: '#/components/schemas/Tension'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateTension
      summary: "Update a tension"
      description: |
        Updates the body, label, status, or meeting_type of an existing tension.
        Status transitions (e.g. to `archived`) are allowed here; automatic
        status computation still runs on save.
      parameters:
        - name: id
          in: path
          required: true
          description: The tension's unique identifier.
          schema:
            type: string
            pattern: '^ten_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TensionInput'
      responses:
        '200':
          description: The updated tension.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Tension'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    delete:
      operationId: deleteTension
      summary: "Delete a tension"
      description: |
        Soft-deletes the tension (sets `discarded_at`). Proposals associated
        with the tension are not cascaded; delete those separately if needed.

        **Not idempotent in the REST-strict sense.** First DELETE on a live
        tension returns 204; subsequent calls return 404 (an already-discarded
        tension is indistinguishable from a never-existed one). Treat
        404-following-204 as success.
      parameters:
        - name: id
          in: path
          required: true
          description: The tension's unique identifier.
          schema:
            type: string
            pattern: '^ten_[0-9a-f]{32}$'
      responses:
        '204':
          description: Tension deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

