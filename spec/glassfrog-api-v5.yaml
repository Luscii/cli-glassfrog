      description: |
        Returns a single project by ID with full details.

        Use `?include=sub_projects,actions` to return the project's
        direct child projects and/or actions inline on the same
        response — saves the extra round-trips to
        `/projects/{id}/sub_projects` and `/projects/{id}/actions` when
        a caller wants everything in one call. Included records use the
        same per-record shape as the corresponding list endpoints.
        Direct children only; per-record auth scoping still applies (a
        caller who can see the project may not see every sub-project or
        action under it).
      parameters:
