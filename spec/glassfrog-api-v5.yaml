        role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        link:
          type: string
          nullable: true
        global:
          type: boolean
        permissions:
          $ref: '#/components/schemas/Permissions'

    MetricInput:
      type: object
      description: Input for creating or updating a metric.
      properties:
        metric:
          type: object
          properties:
            description:
              type: string
            frequency:
              type: string
              enum:
                - Weekly
                - Monthly
                - Quarterly
            link:
              type: string
            permissions:
              $ref: '#/components/schemas/PermissionsInput'

    Action:
      type: object
      description: An action (next-action) on a role.
