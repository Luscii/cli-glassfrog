                project_id:
                  type: string
                  description: The project's unique identifier.
                  pattern: '^proj_[0-9a-f]{32}$'
      responses:
        '201':
          description: The linked project.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
