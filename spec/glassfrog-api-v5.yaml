  /skills:
    get:
      operationId: listSkills
      summary: "List skills"
      x-feature-gate: ai_integration
      description: |
        **Requires AI Integration.** Returns a paginated list of skills in the
        organization. Skills are knowledge documents that can be attached to
        roles and agents. Use `?role_id=` to filter to skills linked to a
        specific role. Use `?tags[]=foo&tags[]=bar` to filter to skills tagged
        with ALL of the listed names (AND semantics, case-insensitive). Returns
        403 when the `ai_integration` flag is not enabled for the organization.
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Q'
        - name: role_id
          in: query
          description: Filter to skills linked to a specific role.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - name: tags
          in: query
          description: >
            Filter to skills tagged with ALL of the supplied tag names
            (case-insensitive). The well-known `specialist` tag marks a
            skill as invokable by a sub-agent.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: A paginated list of skills.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkillSummary'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createSkill
      summary: "Create a skill"
      x-feature-gate: ai_integration
      description: |
        **Requires AI Integration.** Creates a new skill in the organization.
        Requires agents to be enabled for the organization. Returns 403 when
        the `ai_integration` flag is not enabled for the organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillInput'
      responses:
        '201':
          description: The created skill.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Skill'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /skills/{id}:
    get:
      operationId: getSkill
      summary: "Get a skill"
      x-feature-gate: ai_integration
      description: |
        **Requires AI Integration.** Returns a single skill by its ID,
        including the full markdown body. Use `?include=roles` to embed the
        roles linked to this skill. Returns 403 when the `ai_integration`
        flag is not enabled for the organization.
      parameters:
        - name: id
          in: path
          required: true
          description: The skill's unique identifier.
          schema:
            type: string
            pattern: '^skill_[0-9a-f]{32}$'
        - name: include
          in: query
          description: Comma-separated list of related resources to include.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - roles
      responses:
        '200':
          description: A single skill with full body.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Skill'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateSkill
      summary: "Update a skill"
      x-feature-gate: ai_integration
      description: |
        **Requires AI Integration.** Updates the name and/or content of an
        existing skill. Returns 403 when the `ai_integration` flag is not
        enabled for the organization.

        Supports optimistic concurrency via `If-Match`. When present, the
        update only proceeds if the ETag matches the current resource state.
        Omit `If-Match` for unconditional (last-write-wins) updates.
      parameters:
        - name: id
          in: path
          required: true
          description: The skill's unique identifier.
          schema:
            type: string
            pattern: '^skill_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillInput'
      responses:
        '200':
          description: The updated skill.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Skill'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteSkill
      summary: "Delete a skill"
      x-feature-gate: ai_integration
      description: |
