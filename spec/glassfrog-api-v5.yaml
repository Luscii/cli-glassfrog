      description: |
        Updates the title and/or body of an existing note.

        Supports optimistic concurrency via `If-Match`. When present, the
        update only proceeds if the ETag matches the current resource state.
        Omit `If-Match` for unconditional (last-write-wins) updates.

        **Agent token restriction:** Agent-actor tokens cannot set
        `permissions.view` to `public` (returns 403). Only human-held
        tokens may set public visibility.

        **Content size limit, by author.** `body` has a maximum size in
        characters, and the limit is enforced differently depending on who is
        writing. An agent-held token is rejected with 422 when `body` is over
        the limit. A human-held token is not rejected: the note saves, and the
        response carries a `warnings` array saying the note is too large for an
        agent to read. A request whose author cannot be determined is treated as
        an agent and is rejected.

        The 422 body names the submitted size, the limit, and the configuration
        key that set the limit, in the `content_length`, `max_content_length`,
        and `limit_config_key` members. Split the note into smaller notes to
        save it.
      parameters:
        - name: id
          in: path
          required: true
          description: The note's unique identifier.
          schema:
            type: string
            pattern: '^rnot_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '200':
          description: The updated note.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
                  warnings:
                    $ref: '#/components/schemas/ContentSizeWarnings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteNote
      summary: "Delete a note"
      description: Soft-deletes a note. The note is no longer visible but retained in the database.
      parameters:
        - name: id
          in: path
          required: true
          description: The note's unique identifier.
          schema:
            type: string
            pattern: '^rnot_[0-9a-f]{32}$'
      responses:
        '204':
          description: Note deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles/{role_id}/projects:
    get:
      operationId: listRoleProjects
      summary: "List projects for a role"
      description: |
        Returns a paginated list of projects owned by a role. Use `?status=`
        to filter by project status.

        Use `?include=sub_projects,actions` to embed related resources
        on each project in the response. Same lateral-join mechanism as the
        detail endpoint — runs per row, so large result sets with includes
        may be slower.
      parameters:
        - name: role_id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
