                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Skill'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateSkill
      summary: "Update a skill"
      x-feature-gate: ai_integration
      description: |
        **Requires AI Integration.** Updates the name and/or content of an
        existing skill. Returns 403 when the `ai_integration` flag is not
        enabled for the organization.

        Supports optimistic concurrency via `If-Match`. When present, the
        update only proceeds if the ETag matches the current resource state.
        Omit `If-Match` for unconditional (last-write-wins) updates.

        **Content size limit.** `content` has a maximum size in characters.
        Content over the limit returns 422 and is not saved. The 422 body names
        the submitted size, the limit, and the configuration key that set the
        limit, in the `content_length`, `max_content_length`, and
        `limit_config_key` members. Split the skill into smaller skills to save
        it.
      parameters:
        - name: id
          in: path
          required: true
          description: The skill's unique identifier.
          schema:
            type: string
            pattern: '^skill_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillInput'
      responses:
        '200':
          description: The updated skill.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Skill'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteSkill
      summary: "Delete a skill"
      x-feature-gate: ai_integration
      description: |
        **Requires AI Integration.** Soft-deletes a skill. The skill is no
        longer visible but retained in the database. Returns 403 when the
        `ai_integration` flag is not enabled for the organization.
      parameters:
        - name: id
          in: path
          required: true
          description: The skill's unique identifier.
          schema:
            type: string
            pattern: '^skill_[0-9a-f]{32}$'
      responses:
        '204':
          description: Skill deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

