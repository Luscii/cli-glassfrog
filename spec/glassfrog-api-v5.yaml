      summary: "Update a project"
      description: Updates the description, status, or other fields of an existing project.
      parameters:
        - name: id
          in: path
          required: true
          description: The project's unique identifier.
          schema:
            type: string
            pattern: '^proj_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteProject
      summary: "Delete a project"
      description: Soft-deletes a project. The project is no longer visible but retained in the database.
      parameters:
        - name: id
          in: path
          required: true
          description: The project's unique identifier.
          schema:
            type: string
            pattern: '^proj_[0-9a-f]{32}$'
      responses:
        '204':
          description: Project deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # -- Proposals (governance) --

  /proposals:
    get:
      operationId: listProposals
      summary: "List governance proposals"
      description: |
        Returns proposals visible to the caller. Supports filtering by
        status, circle (via `role_id`), and date ranges. Response summary
        stats only — no per-person attribution.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, proposed_outside_meeting, escalated, accepted, draft_with_conflicts]
          description: Filter by proposal status.
        - name: role_id
          in: query
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
          description: |
            Filter to proposals in the circle supported by this role.
        - name: proposer_id
          in: query
          schema:
            type: string
            pattern: '^per_[0-9a-f]{32}$'
          description: Filter to proposals created by this person.
        - name: proposed_after
          in: query
          schema:
            type: string
            format: date-time
          description: Only proposals with `proposed_at` on or after this timestamp.
        - name: accepted_after
          in: query
          schema:
            type: string
            format: date-time
          description: Only proposals with `accepted_at` on or after this timestamp.
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
          description: Pagination cursor from a previous response.
      responses:
        '200':
          description: Paginated list of proposals.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Proposal'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createProposal
      summary: "Create a governance proposal (draft)"
      description: |
        **Premium — requires async proposals.** Creates a proposal in `draft`
        state, anchored to an existing tension. Each entry in `changes` is a
        governance command (create role, add accountability, etc.) applied
        atomically at acceptance time. Returns 403 when async proposals are
        not enabled.

        Advancing the proposal to circulation happens via a separate action
        call: `POST /proposals/{id}/propose`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalRequest'
      responses:
        '201':
          description: Proposal created in draft state.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /proposals/{id}:
    get:
      operationId: getProposal
      summary: "Get a proposal"
      description: |
        Returns a proposal with its changes, response summary stats, and the
        list of transitions the caller may invoke on it right now
        (`available_transitions`). Per-person response attribution is
        intentionally not exposed.
      parameters:
        - name: id
          in: path
          required: true
          description: Proposal ID (TypeID).
          schema:
            type: string
            pattern: '^prp_[0-9a-f]{32}$'
      responses:
        '200':
          description: Proposal detail.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /proposals/{proposal_id}/propose:
    post:
      operationId: proposeProposal
      summary: "Advance a draft proposal into circulation"
      description: |
        **Premium — requires async proposals.** Advances a `draft` proposal
        to `proposed_outside_meeting` (the shortcut-path circulation state)
        and auto-registers the proposer's implicit `no_objection` response.
        Returns 403 when async proposals are not enabled.

        The backend dispatches `propose` to the appropriate internal path
        (shortcut / meeting-queue / CL-forward / etc.) based on circle + org
        config. Today only the shortcut path exists; future config-driven
        paths will share this same API surface (callers don't choose the path
        — the org's config does).

        Allowed when the caller appears in `available_transitions` for this
        proposal — typically the proposer of a `draft` proposal.

        Implications:
          * Notifications fire (per the existing
            `Notifications::NotifyNewAsyncProposal` chain — Slack /
            email / etc., depending on the circle's notifications config).
          * `response_deadline` is set from the circle's
            `proposal_auto_accept_day_limit`.
          * Proposer's implicit `no_objection` is recorded (counts toward
            `received_response_count`).
      parameters:
        - name: proposal_id
          in: path
          required: true
          description: Proposal ID (TypeID).
          schema:
            type: string
            pattern: '^prp_[0-9a-f]{32}$'
      responses:
        '200':
          description: Proposal advanced to `proposed_outside_meeting`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /proposals/{proposal_id}/withdraw:
    post:
      operationId: withdrawProposal
      summary: "Withdraw a circulating proposal back to draft"
      description: |
        **Premium — requires async proposals.** Returns a
        `proposed_outside_meeting` or `escalated` proposal to `draft`.
        Allowed for the proposer (and admins) when the proposal appears in
        `available_transitions`. Returns 403 when async proposals are not
        enabled.

        Implications:
          * All existing `proposal_responses` are deleted (responders will
            need to re-respond if the proposal is later re-proposed).
          * `proposed_at` and `response_deadline` are cleared.
          * The proposal can be re-edited and re-proposed.
      parameters:
        - name: proposal_id
          in: path
          required: true
          description: Proposal ID (TypeID).
          schema:
            type: string
            pattern: '^prp_[0-9a-f]{32}$'
      responses:
        '200':
          description: Proposal returned to `draft`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /proposals/{proposal_id}/responses:
    post:
      operationId: createProposalResponse
      summary: "Record a circle member's response to a proposal"
      description: |
        **Premium — requires async proposals.** Returns 403 when async
        proposals are not enabled.

        Circle members post one of two values during the consent window:

        * `no_objection` — willing to let the proposal pass as written. When
          every expected responder has `no_objection`, the cron auto-accepts.

        * `bring_to_meeting` — wants to discuss the proposal in a live
          governance meeting rather than let it circulate to auto-acceptance.
          This is NOT a retracted or formally-objected-to claim; the response
          persists on the proposal and blocks auto-acceptance. When the
          circle's agenda is ready, the proposal transitions to `escalated`
          for live discussion.

        One response per person per proposal (422 on second attempt).
      parameters:
        - name: proposal_id
          in: path
          required: true
          description: Proposal ID (TypeID).
          schema:
            type: string
            pattern: '^prp_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalResponseRequest'
      responses:
        '201':
          description: Response recorded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProposalVote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

