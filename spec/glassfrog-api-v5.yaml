      responses:
        '200':
          description: A paginated list of direct child projects.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{id}:
    get:
      operationId: getProject
      summary: "Get a project"
      description: |
        Returns a single project by ID with full details.

        Use `?include=sub_projects,actions` to return the project's
        direct child projects and/or actions inline on the same
        response — saves the extra round-trips to
        `/projects/{id}/sub_projects` and `/projects/{id}/actions` when
        a caller wants everything in one call. Included records use the
        same per-record shape as the corresponding list endpoints.
        Direct children only; per-record auth scoping still applies (a
        caller who can see the project may not see every sub-project or
        action under it).
      parameters:
        - name: id
          in: path
          required: true
          description: The project's unique identifier.
          schema:
            type: string
            pattern: '^proj_[0-9a-f]{32}$'
        - name: include
          in: query
          description: |
            Comma-separated list of related resources to include.
            Each value mirrors the name of its sub-endpoint and the key
            it lands under in the response. Unknown values are silently
            ignored.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - sub_projects
                - actions
      responses:
        '200':
          description: A single project with full details.
          content:
            application/json:
              schema:
                type: object
                required:
