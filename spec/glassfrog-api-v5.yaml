      operationId: deleteGoal
      summary: "Soft-delete a goal"
      description: |
        Discards the goal (and its targets). The goal is no longer visible
        but retained in the database.

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: id
          in: path
          required: true
          description: The goal's unique identifier.
          schema:
            type: string
            pattern: '^goal_[0-9a-f]{32}$'
      responses:
        '204':
          description: Goal deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /goals/{goal_id}/supporting_projects:
    get:
      operationId: listGoalSupportingProjects
      summary: "List projects supporting a goal"
      description: |
        Returns a paginated list of projects linked to the goal via
        `GoalSupport`.

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: goal_id
          in: path
          required: true
          description: The goal's unique identifier.
          schema:
            type: string
            pattern: '^goal_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A paginated list of supporting projects.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: linkGoalSupportingProject
      summary: "Link a project to a goal"
      description: |
        Creates a `GoalSupport` record linking an existing project to the
        goal. A project may only be linked to one goal or target at a time;
        if it is already linked elsewhere, returns 422.

        Idempotent — linking a project that is already linked to this goal
        returns 201 without creating a duplicate.

        Requires `manage` permission on the goal (circle membership of the
        goal's role) and visibility of the project.

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: goal_id
          in: path
          required: true
          description: The goal's unique identifier.
          schema:
            type: string
            pattern: '^goal_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
              properties:
                project_id:
                  type: string
                  description: The project's unique identifier.
                  pattern: '^proj_[0-9a-f]{32}$'
      responses:
        '201':
          description: The linked project.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /goals/{goal_id}/supporting_projects/{id}:
    delete:
      operationId: unlinkGoalSupportingProject
      summary: "Unlink a project from a goal"
      description: |
        Destroys the `GoalSupport` record linking the project to the goal.

        Requires `manage` permission on the goal (circle membership of the
        goal's role) and visibility of the project.

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: goal_id
          in: path
          required: true
          description: The goal's unique identifier.
          schema:
            type: string
            pattern: '^goal_[0-9a-f]{32}$'
        - name: id
          in: path
          required: true
          description: The project's unique identifier.
          schema:
            type: string
            pattern: '^proj_[0-9a-f]{32}$'
      responses:
        '204':
          description: Successfully unlinked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /goals/{goal_id}/targets:
    get:
      operationId: listGoalTargets
      summary: "List targets for a goal"
      description: |
        Returns a paginated list of targets for the goal.

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: goal_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^goal_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A paginated list of targets.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Target'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createGoalTarget
      summary: "Create a target under a goal"
      description: |
        Creates a new target under the goal. The target inherits the
        goal's role by default (targets may belong to a different role,
        but in the MVP we pass the goal's role through).

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: goal_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^goal_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetInput'
      responses:
        '201':
          description: The created target.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Target'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /goals/{goal_id}/progress:
    get:
      operationId: listGoalProgressUpdates
      summary: "List progress updates for a goal"
      description: |
        Returns the progress update history for a goal, newest first.

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: goal_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^goal_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A paginated list of progress updates.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProgressUpdate'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createGoalProgressUpdate
      summary: "Log a progress update on a goal"
      description: |
        Creates a new progress update for the goal (value + health + note).

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: goal_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^goal_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpdateInput'
      responses:
        '201':
          description: The created progress update.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProgressUpdate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /targets/{id}:
    get:
      operationId: getTarget
      summary: "Get a target"
      description: |
        Returns a single target by ID.

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^tgt_[0-9a-f]{32}$'
      responses:
        '200':
          description: A single target.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Target'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateTarget
      summary: "Update a target"
      description: |
        Returns 403 when the organization has goals disabled.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^tgt_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetInput'
      responses:
        '200':
          description: The updated target.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Target'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteTarget
      summary: "Soft-delete a target"
      description: |
        Returns 403 when the organization has goals disabled.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^tgt_[0-9a-f]{32}$'
      responses:
        '204':
          description: Target deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /targets/{target_id}/progress:
    get:
      operationId: listTargetProgressUpdates
      summary: "List progress updates for a target"
      description: |
        Returns the progress update history for a target, newest first.

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^tgt_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A paginated list of progress updates.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProgressUpdate'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createTargetProgressUpdate
      summary: "Log a progress update on a target"
      description: |
        Creates a new progress update for the target (value + health + note).

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^tgt_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpdateInput'
      responses:
        '201':
          description: The created progress update.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProgressUpdate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Your GlassFrog API v5 key.

  headers:
    ETag:
      description: |
        Hash of the resource's current state. Pass this value back as
        `If-Match` on subsequent PUT/PATCH requests to enable optimistic
        concurrency checking.
      schema:
        type: string
        example: '"a1b2c3d4e5f6..."'
    RateLimitLimit:
      description: Maximum requests allowed in the current window.
      schema:
        type: integer
        example: 50
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        example: 47
    RateLimitReset:
      description: Unix epoch timestamp when the current window resets.
      schema:
        type: integer
        example: 1714600800
    RetryAfter:
      description: Seconds to wait before retrying (present on 429 responses).
      schema:
        type: integer
        example: 42

  parameters:
    PerPage:
      name: per_page
      in: query
      description: >-
        Number of results per page (1–500, default 100). Values above the maximum
        return `400 Bad Request`; blank, zero, negative, or non-numeric values fall
        back to the default of 100.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

    Cursor:
      name: cursor
      in: query
      description: Cursor from a previous response's `meta.pagination.next_cursor`.
      schema:
        type: string

    Locale:
      name: locale
      in: query
      description: |
        Override the response locale. Affects localized fields such as core
        role names. Resolution order: this param > subdomain > org default >
        app default (en).
      schema:
        type: string
        example: fr

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        ETag from a previous GET response. When present, the server checks
        that the resource has not been modified since your read. If the ETag
        is stale, a 409 Conflict is returned. Omit this header for
        unconditional (last-write-wins) updates.
      schema:
        type: string
        example: '"a1b2c3d4e5f6..."'

    Q:
      name: q
      in: query
      description: |
        Full-text search filter. Matches against the resource's searchable text
        fields using Postgres full-text search (`simple` + `unaccent`). Supports
        Google-style syntax: `marketing -intern`, `"exact phrase"`, `foo OR bar`.
        Composes with other filters (all AND'd together). Empty or whitespace-only
        values are ignored. Malformed queries return no rows rather than an error.
      schema:
        type: string
      example: marketing

  schemas:
    # -- Pagination --

    Pagination:
      type: object
      required:
        - per_page
        - has_next_page
      properties:
        per_page:
          type: integer
          example: 100
        has_next_page:
          type: boolean
        next_cursor:
          type: string
          description: Present when `has_next_page` is true. Pass as `?cursor=` to fetch the next page.

    # -- Shared sub-resources (always inline) --

    Accountability:
      type: object
      required:
        - id
        - description
      properties:
        id:
          type: string
          pattern: '^acct_[0-9a-f]{32}$'
          example: acct_0123456789abcdef0123456789abcdef
        description:
          type: string
          example: Defining coding standards for the team

    DomainRef:
      type: object
      required:
        - id
        - description
      properties:
        id:
          type: string
          pattern: '^dom_[0-9a-f]{32}$'
          example: dom_0123456789abcdef0123456789abcdef
        description:
          type: string
          example: Company website

    # -- Role schemas --

    Role:
      type: object
      description: A role in the organization.
      required:
        - id
        - type
        - name
        - purpose
        - parent_role_id
        - has_subroles
        - flags
        - accountabilities
        - domains
        - fillers
        - tags
      properties:
        id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
          example: role_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - role
        name:
          type: string
          example: Circle Lead
          nullable: true
          description: |
            Localized display name. For core roles, applies the organization's
            custom term overrides first, then locale-based translation (via
            `?locale=` param, subdomain, or org default). Custom roles pass
            through unchanged.
        purpose:
          type: string
          nullable: true
          example: Steering the role toward its purpose
        parent_role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: ID of the parent role. Null for anchor roles.
        has_subroles:
          type: boolean
          description: Whether this role is expanded with subroles.
        flags:
          type: array
          items:
            type: string
            enum:
              - structural
              - elected
              - linked
          description: |
            Classification flags. `structural` = core Holacracy role,
            `elected` = filled by election, `linked` = cross-linked from another role.
        accountabilities:
          type: array
          items:
            $ref: '#/components/schemas/Accountability'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/DomainRef'
        fillers:
          type: array
          items:
            $ref: '#/components/schemas/Actor'
          description: People and agents currently filling this role.
        tags:
          type: array
          items:
            type: string
          description: Tag names applied to this role.
          example:
            - marketing
            - q2

    RoleDetail:
      description: A role with optional included resources (detail view).
      allOf:
        - $ref: '#/components/schemas/Role'
        - type: object
          properties:
            assignments:
              type: array
              items:
                $ref: '#/components/schemas/Assignment'
              description: Present when `?include=assignments` is requested.
            subroles:
              type: array
              items:
                $ref: '#/components/schemas/Role'
              description: Present when `?include=subroles` is requested.
            parent_role:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Role'
              description: Present when `?include=parent_role` is requested. Null for anchor roles.
            policies:
              type: array
              items:
                $ref: '#/components/schemas/Policy'
              description: Present when `?include=policies` is requested.
            notes:
              type: array
              items:
                $ref: '#/components/schemas/Note'
              description: Present when `?include=notes` is requested.
            skills:
              type: array
              items:
                $ref: '#/components/schemas/SkillSummary'
              description: >
                Present when `?include=skills` is requested. Returns skill
                summaries (no `content`); fetch full content on demand via
                `GET /skills/{id}`.

    TreeNode:
      type: object
      description: |
        A role in the tree response. `children` is always present (possibly
        empty). `accountabilities`, `domains`, and `fillers` are present only
        when their corresponding `?include=` value is set.
      required:
        - id
        - type
        - name
        - purpose
        - parent_role_id
        - has_subroles
        - flags
        - children
      properties:
        id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
        type:
          type: string
          enum:
            - role
        name:
          type: string
          nullable: true
        purpose:
          type: string
          nullable: true
        parent_role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: |
            ID of the parent role. Null for the anchor role. Present on every
            node even though nesting is already conveyed by `children`, so
            that consumers who flatten the tree to a list retain the edge.
        has_subroles:
          type: boolean
        flags:
          type: array
          items:
            type: string
            enum:
              - structural
              - elected
              - linked
        children:
          type: array
          description: |
            Direct children of this node, each of which is itself a
            `TreeNode`. Empty array when the node is a leaf, when `?depth`
            truncates beneath it, or when all children are hidden by
            authorization.
          items:
            $ref: '#/components/schemas/TreeNode'
        accountabilities:
          type: array
          items:
            $ref: '#/components/schemas/Accountability'
          description: Present when `?include=accountabilities` is requested.
        domains:
          type: array
          items:
            $ref: '#/components/schemas/DomainRef'
          description: Present when `?include=domains` is requested.
        fillers:
          type: array
          items:
            $ref: '#/components/schemas/Actor'
          description: Present when `?include=members` is requested.

    Assignment:
      type: object
      description: |
        A role assignment. `role_id` and `actor_id` are always present.
        Use `?include=actor` or `?include=role` to embed the full related object.
      required:
        - id
        - type
        - role_id
        - actor_id
        - focus
        - elected_until
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^asgn_[0-9a-f]{32}$'
          example: asgn_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum: [assignment]
        role_id:
          type: string
          description: The role being filled. Always present.
          pattern: '^role_[0-9a-f]{32}$'
          example: role_0123456789abcdef0123456789abcdef
        actor_id:
          type: string
          description: The person or agent filling the role. Always present.
          example: per_0123456789abcdef0123456789abcdef
        focus:
          type: string
          nullable: true
          description: Optional focus area for the assignment.
        elected_until:
          type: string
          format: date
          nullable: true
          description: Election expiry date, if applicable.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        actor:
          type: object
          description: Present when `?include=actor` is requested (default from `/roles/{id}/assignments`).
          required: [id, name, kind]
          properties:
            id:
              type: string
              description: The person or agent API ID.
              example: per_0123456789abcdef0123456789abcdef
            name:
              type: string
              description: Display name of the actor.
              example: Alice Smith
            kind:
              type: string
              enum: [human, agent]
              description: Whether the actor is a human or an AI agent.
        role:
          type: object
          description: Present when `?include=role` is requested (default from `/actors/{id}/assignments`).
          required: [id, type, name]
          properties:
            id:
              type: string
              pattern: '^role_[0-9a-f]{32}$'
            type:
              type: string
              enum: [role]
            name:
              type: string
            purpose:
              type: string
              nullable: true
            parent_role_id:
              type: string
              nullable: true
              pattern: '^role_[0-9a-f]{32}$'


    # -- Policy schemas (standalone endpoints) --

    Policy:
      type: object
      description: A policy with full body content.
      required:
        - id
        - type
        - title
        - body
        - role_id
        - domain_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^pol_[0-9a-f]{32}$'
          example: pol_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - policy
        title:
          type: string
          example: All PRs require two approvals
        body:
          type: string
          nullable: true
          description: The full policy body text (may contain HTML).
        role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: The role this policy governs. Null for role-level policies.
        domain_id:
          type: string
          nullable: true
          pattern: '^dom_[0-9a-f]{32}$'
          description: The domain this policy is scoped to. Null if the policy applies to the whole role.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # -- Domain schemas (standalone endpoints) --

    Domain:
      type: object
      description: A domain resource.
      required:
        - id
        - type
        - description
        - role_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^dom_[0-9a-f]{32}$'
          example: dom_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - domain
        description:
          type: string
          example: Code review standards
        role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: The role that controls this domain.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
          description: Present when `?include=policies` is requested.


    # -- Note schemas (standalone endpoints) --

    Permissions:
      type: object
      description: >-
        Effective permissions for a resource. The `view` and `manage` fields
        report the permission group that applies, resolved for the org's
        public/private status.
      required:
        - view
        - manage
      properties:
        view:
          type: string
          enum: [public, org_member, peer_roles]
          description: >-
            Who can see this record. Resolved based on the org's
            public/private status (e.g., `visible_to_all` on a public org
            reports as `public`, on a private org as `org_member`).
        manage:
          type: string
          enum: [peer_roles]
          description: Who can edit/delete this record.

    PermissionsInput:
      type: object
      description: >-
        Optional permissions override. Omit to use defaults.
      properties:
        view:
          type: string
          enum: [public, org_member, peer_roles]
          description: >-
            Who can see this record. `public`/`org_member` map to the default
            visibility; `peer_roles` restricts to peer role holders in the circle.

    Note:
      type: object
      description: A note on a role.
      required:
        - id
        - type
        - title
        - body
        - role_id
        - permissions
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^rnot_[0-9a-f]{32}$'
          example: rnot_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - note
        title:
          type: string
          example: How to run the deploy process
        body:
          type: string
          description: Full markdown content of the note.
        role_id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
        permissions:
          $ref: '#/components/schemas/Permissions'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time


    NoteInput:
      type: object
      description: Input for creating or updating a note.
      properties:
        note:
          type: object
          properties:
            title:
              type: string
              maxLength: 255
            body:
              type: string
              description: Markdown content.
            permissions:
              $ref: '#/components/schemas/PermissionsInput'

    NoteListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'

    # -- Project schemas --

    Project:
      type: object
      description: A project on a role (list view).
      required:
        - id
        - type
        - description
        - status
        - role_id
        - individual_initiative
        - has_sub_projects
        - has_actions
        - parent_project_id
        - tags
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^proj_[0-9a-f]{32}$'
          example: proj_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - project
        description:
          type: string
          example: Rebuild onboarding flow
        status:
          type: string
          enum:
            - archived
            - cancelled
            - completed
            - current
            - scheduled
            - someday
            - waiting
        role_id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
          description: The role that owns this project. Null for non-role-owned projects.
        individual_initiative:
          type: boolean
          description: Whether the project is an individual initiative (not owned by a specific role).
        has_sub_projects:
          type: boolean
          description: Whether this project has non-discarded sub-projects.
        has_actions:
          type: boolean
          description: Whether this project has non-discarded actions.
        parent_project_id:
          type: string
          nullable: true
          pattern: '^proj_[0-9a-f]{32}$'
          description: The api_id of the parent project, or null if there is no parent.
        tags:
          type: array
          items:
            type: string
          description: Tag names applied to this project.
          example:
            - marketing
            - q2
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sub_projects:
          type: array
          description: |
            Direct child projects. Only present when `?include=sub_projects`
            is requested.
          items:
            $ref: '#/components/schemas/Project'
        actions:
          type: array
          description: |
            Actions belonging to this project. Only present when
            `?include=actions` is requested.
          items:
            $ref: '#/components/schemas/Action'
        link:
          type: string
          nullable: true
          description: External link associated with the project.
        note:
          type: string
          nullable: true
          description: Internal note on the project.
        value:
          type: number
          nullable: true
          description: Perceived value rating.
        effort:
          type: number
          nullable: true
          description: Estimated effort rating.
        permissions:
          $ref: '#/components/schemas/Permissions'

    ProjectInput:
      type: object
      description: Input for creating or updating a project.
      properties:
        project:
          type: object
          properties:
            description:
              type: string
            status:
              type: string
              enum:
                - archived
                - cancelled
                - completed
                - current
                - scheduled
                - someday
                - waiting
            link:
              type: string
            note:
              type: string
            value:
              type: number
            effort:
              type: number
            individual_initiative:
              type: boolean
              default: false
              description: Whether the project is an individual initiative (not owned by a specific role).
            parent_project_id:
              type: string
              nullable: true
              pattern: '^proj_[0-9a-f]{32}$'
              description: Set the parent project by api_id. Pass null to clear.
            permissions:
              $ref: '#/components/schemas/PermissionsInput'

    # -- Custom Field schemas --

    CustomField:
      type: object
      description: A custom field on a role.
      required:
        - id
        - type
        - field_name
        - field_value
        - role_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^cf_[0-9a-f]{32}$'
          example: cf_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - custom_field
        field_name:
          type: string
          example: KPIs
        field_value:
          type: string
          example: Revenue growth, customer satisfaction
        role_id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CustomFieldInput:
      type: object
      description: Input for creating or updating a custom field.
      properties:
        custom_field:
          type: object
          properties:
            field_name:
              type: string
            field_value:
              type: string

    # -- Search schemas --

    SearchResult:
      type: object
      required:
        - type
        - id
        - title
        - excerpt
        - rank
      properties:
        type:
          type: string
          description: The resource type.
          enum:
            - role
            - note
            - project
            - action
            - skill
            - actor
            - policy
            - domain
        id:
          type: string
          description: The resource's unique identifier.
        title:
          type: string
          description: The resource's title or name.
        excerpt:
          type: string
          nullable: true
          description: A highlighted excerpt from the matching content.
        rank:
          type: number
          format: float
          description: Relevance rank score.
        role_id:
          type: string
          nullable: true
          description: The owning role's API ID, when applicable.

    # -- Tag schemas --

    Tag:
      type: object
      description: An organization-scoped tag.
      required:
        - id
        - type
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier with `tag_` prefix.
          example: tag_0123456789abcdef0123456789abcdef
          pattern: '^tag_[0-9a-f]{32}$'
        type:
          type: string
          enum:
            - tag
        name:
          type: string
          example: marketing
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TagInput:
      type: object
      description: Input for creating or updating a tag.
      properties:
        tag:
          type: object
          properties:
            name:
              type: string

    PersonInput:
      type: object
      description: Input for inviting or updating a person.
      properties:
        person:
          type: object
          properties:
            name:
              type: string
              description: The person's display name.
              example: Alice Smith
            email:
              type: string
              format: email
              description: The person's email address.
              example: alice@example.com
            admin:
              type: boolean
              description: Whether to grant org admin access. Requires caller to be an org admin.

    # -- Actor schemas --

    Actor:
      type: object
      description: A person or agent in the organization.
      required:
        - id
        - type
        - name
        - kind
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier. `per_` prefix for humans, `agt_` for agents.
          example: per_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - actor
        name:
          type: string
          example: Alice Smith
        kind:
          type: string
          enum:
            - human
            - agent
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: Present when `?include=roles` is requested. Full role shape.
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
          description: Present when `?include=assignments` is requested. Same shape as on roles.


    Organization:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          pattern: '^org_[0-9a-f]{32}$'
        name:
          type: string

    Membership:
      type: object
      description: A person's membership in an organization.
      required:
        - id
        - type
        - actor_id
        - organization_id
        - access_level
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^mem_[0-9a-f]{32}$'
        type:
          type: string
          enum:
            - membership
        actor_id:
          type: string
          description: The member (person or agent).
        organization_id:
          type: string
          pattern: '^org_[0-9a-f]{32}$'
        access_level:
          type: string
          enum:
            - admin
            - normal
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MeResponse:
      type: object
      description: Authenticated actor bundled with org context.
      required:
        - actor
        - organization
        - membership
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        organization:
          $ref: '#/components/schemas/Organization'
        membership:
          $ref: '#/components/schemas/Membership'
        roles:
          type: array
          description: Present when `?include=roles` is requested. Same shape as `GET /roles`.
          items:
            $ref: '#/components/schemas/Role'

    # -- Skill schemas --

    SkillSummary:
      type: object
      description: >
        A skill as returned in list responses. Omits the full markdown
        `content` to keep list payloads small — fetch full content on demand
        via `GET /skills/{id}`.
      required:
        - id
        - type
        - name
        - tags
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^skill_[0-9a-f]{32}$'
          example: skill_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - skill
        name:
          type: string
          example: Code Review Standards
        tags:
          type: array
          items:
            type: string
          description: >
            Tag names applied to this skill, sorted alphabetically.
            Tags are free-form strings organized by convention.
            The well-known `specialist` tag marks a skill as invokable by a sub-agent.
          example:
            - specialist
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Skill:
      description: A skill including the full markdown body.
      allOf:
        - $ref: '#/components/schemas/SkillSummary'
        - type: object
          required:
            - content
          properties:
            content:
              type: string
              nullable: true
              description: The full markdown content of the skill.

    SkillDetail:
      description: A skill with optional included resources.
      allOf:
        - $ref: '#/components/schemas/Skill'
        - type: object
          properties:
            roles:
              type: array
              items:
                $ref: '#/components/schemas/Role'
              description: Present when `?include=roles` is requested.


    # -- Action schemas --

    ChecklistItem:
      type: object
      description: A checklist item on a role.
      required:
        - id
        - type
        - description
        - frequency
        - role_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^chck_[0-9a-f]{32}$'
          example: chck_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - checklist_item
        description:
          type: string
          nullable: true
          example: Weekly review completed
        frequency:
          type: string
          nullable: true
          enum:
            - Weekly
            - Monthly
            - Quarterly
          example: Weekly
        role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        link:
          type: string
          nullable: true
        global:
          type: boolean
        permissions:
          $ref: '#/components/schemas/Permissions'

    ChecklistItemInput:
      type: object
      description: Input for creating or updating a checklist item.
      properties:
        checklist_item:
          type: object
          properties:
            description:
              type: string
            frequency:
              type: string
              enum:
                - Weekly
                - Monthly
                - Quarterly
            link:
              type: string
            permissions:
              $ref: '#/components/schemas/PermissionsInput'

    Metric:
      type: object
      description: A metric on a role.
      required:
        - id
        - type
        - description
        - frequency
        - role_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^mtrc_[0-9a-f]{32}$'
          example: mtrc_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - metric
        description:
          type: string
          nullable: true
          example: Sprint velocity
        frequency:
          type: string
          nullable: true
          enum:
            - Weekly
            - Monthly
            - Quarterly
          example: Weekly
        role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        link:
          type: string
          nullable: true
        global:
          type: boolean
        permissions:
          $ref: '#/components/schemas/Permissions'

    MetricInput:
      type: object
      description: Input for creating or updating a metric.
      properties:
        metric:
          type: object
          properties:
            description:
              type: string
            frequency:
              type: string
              enum:
                - Weekly
                - Monthly
                - Quarterly
            link:
              type: string
            permissions:
              $ref: '#/components/schemas/PermissionsInput'

    Action:
      type: object
      description: An action (next-action) on a role.
      required:
        - id
        - type
        - description
        - status
        - role_id
        - individual_initiative
        - parent_project_id
        - tags
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^actn_[0-9a-f]{32}$'
          example: actn_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - action
        description:
          type: string
          nullable: true
          example: Review PR #6818
        status:
          type: string
          enum:
            - archived
            - cancelled
            - completed
            - current
            - scheduled
            - someday
            - waiting
          example: current
        role_id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
          description: The role that owns this action.
        individual_initiative:
          type: boolean
          description: Whether the action is an individual initiative (not owned by a specific role).
        parent_project_id:
          type: string
          nullable: true
          pattern: '^proj_[0-9a-f]{32}$'
          description: The api_id of the parent project, or null if not linked to a project.
        tags:
          type: array
          items:
            type: string
          description: Tag names applied to this action.
          example:
            - marketing
            - q2
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        permissions:
          $ref: '#/components/schemas/Permissions'
        trigger_event:
          type: string
          nullable: true
        note:
          type: string
          nullable: true

    AssignmentInput:
      type: object
      description: Input for updating an assignment.
      properties:
        focus:
          type: string
          nullable: true
          description: Optional focus area for the assignment.

    ActionInput:
      type: object
      description: Input for creating or updating an action.
      properties:
        action_item:
          type: object
          properties:
            description:
              type: string
            status:
              type: string
              enum:
                - archived
                - cancelled
                - completed
                - current
                - scheduled
                - someday
                - waiting
            permissions:
              $ref: '#/components/schemas/PermissionsInput'
            trigger_event:
              type: string
            note:
              type: string
            individual_initiative:
              type: boolean
              default: false
              description: Whether the action is an individual initiative (not owned by a specific role).
            parent_project_id:
              type: string
              nullable: true
              pattern: '^proj_[0-9a-f]{32}$'
              description: Set the parent project by api_id. Pass null to unlink.

    Tension:
      type: object
      description: A tension sensed by a role filler.
      required:
        - id
        - type
        - body
        - status
        - role_id
        - sensed_by_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^ten_[0-9a-f]{32}$'
          example: ten_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - tension
        body:
          type: string
          nullable: true
          example: We ship work faster than we update the roadmap.
        status:
          type: string
          description: |
            Lifecycle state. `unprocessed` and `processed` are auto-computed from the
            presence of associated actions/projects/proposals/agenda-items. Clients
            can set `archived` explicitly via PATCH.
          enum:
            - unprocessed
            - processed
            - archived
          example: unprocessed
        role_id:
          type: string
          nullable: true
          description: The role that sensed this tension (column `impacted_role_id`; semantically the sensing role per app convention).
          pattern: '^role_[0-9a-f]{32}$'
        sensed_by_id:
          type: string
          nullable: true
          description: The person who sensed and captured this tension.
          pattern: '^per_[0-9a-f]{32}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        label:
          type: string
          nullable: true
        meeting_type:
          type: string
          nullable: true
          enum:
            - tactical
            - governance
            - null
        parent_role_id:
          type: string
          nullable: true
          description: The role id of the parent role this tension belongs to, if any.
          pattern: '^role_[0-9a-f]{32}$'

    TensionInput:
      type: object
      description: Input for creating or updating a tension.
      properties:
        tension:
          type: object
          properties:
            body:
              type: string
            label:
              type: string
            status:
              type: string
              enum:
                - unprocessed
                - processed
                - archived
            meeting_type:
              type: string
              nullable: true
              enum:
                - tactical
                - governance


    Goal:
      type: object
      description: |
        A goal (objective) on a role. Progress is computed on read as the mean
        of kept target progresses, clamped to `[0, 100]`. When a goal has no
        targets, progress is `null` (not `0`).
      required:
        - id
        - type
        - description
        - status
        - role_id
        - progress
        - has_supporting_goals
        - has_supporting_projects
        - parent_goal_id
        - start_date
        - end_date
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^goal_[0-9a-f]{32}$'
          example: goal_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - goal
        description:
          type: string
          example: Dominate the world
        status:
          type: string
          enum:
            - draft
            - approved
            - finished
        role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
        progress:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: |
            Mean of kept target progresses, rounded. `null` when the goal has
            no targets. Targets the caller can't see are still counted in the
            server-side rollup (the goal's progress is an org-level aggregate).
        has_supporting_goals:
          type: boolean
          description: Whether this goal has non-discarded child/supporting goals.
        has_supporting_projects:
          type: boolean
          description: Whether this goal has non-discarded, non-private supporting projects.
        parent_goal_id:
          type: string
          nullable: true
          pattern: '^goal_[0-9a-f]{32}$'
          description: |
            The `api_id` of the parent goal, or `null` if there is no parent.
            When multiple parents exist, returns one (non-deterministic).
        start_date:
          type: string
          nullable: true
          format: date
        end_date:
          type: string
          nullable: true
          format: date
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        targets:
          type: array
          description: |
            Targets (key results) under this goal. Only present when
            `?include=targets` is requested.
          items:
            $ref: '#/components/schemas/Target'
        supporting_projects:
          type: array
          description: |
            Projects linked as supporting this goal. Only present when
            `?include=supporting_projects` is requested.
          items:
            $ref: '#/components/schemas/Project'

    GoalInput:
      type: object
      description: Input for creating or updating a goal.
      properties:
        goal:
          type: object
          properties:
            description:
              type: string
            status:
              type: string
              enum:
                - draft
                - approved
                - finished
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
            date_range_id:
              type: integer

    Target:
      type: object
      description: |
        A target (key result) under a goal. Progress is computed on read via
        `(current_value - starting_value) / (ending_value - starting_value) * 100`,
        clamped to `[0, 100]`. Edge cases: starting/ending/current nulls → 0;
        `ending_value == starting_value` → 100 if current ≥ ending else 0.
      required:
        - id
        - type
        - description
        - status
        - goal_id
        - role_id
        - starting_value
        - ending_value
        - current_value
        - progress
        - value_prefix
        - value_suffix
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^tgt_[0-9a-f]{32}$'
          example: tgt_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - target
        description:
          type: string
          example: Ship it by Q4
        status:
          type: string
          enum:
            - draft
            - approved
            - finished
        goal_id:
          type: string
          nullable: true
          pattern: '^goal_[0-9a-f]{32}$'
        role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: |
            The role the target is assigned to. May differ from the parent
            goal's role (cross-circle target alignment is supported).
        starting_value:
          type: number
          nullable: true
        ending_value:
          type: number
          nullable: true
        current_value:
          type: number
          nullable: true
          description: |
            The value from the latest kept progress update on this target.
            Null when the target has no progress updates yet.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Computed percentage (see schema description for formula and edge cases).
        value_prefix:
          type: string
          nullable: true
          description: Optional unit prefix rendered before the value (e.g. `$`).
        value_suffix:
          type: string
          nullable: true
          description: Optional unit suffix rendered after the value (e.g. `%`).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TargetInput:
      type: object
      description: Input for creating or updating a target.
      properties:
        target:
          type: object
          properties:
            description:
              type: string
            status:
              type: string
              enum:
                - draft
                - approved
                - finished
            starting_value:
              type: number
            ending_value:
              type: number
            value_prefix:
              type: string
            value_suffix:
              type: string
            role_id:
              type: string
              pattern: '^role_[0-9a-f]{32}$'

    ProgressUpdate:
      type: object
      description: |
        A time-series health/value update on a goal or target. Goal-parented
        updates do not require a `value` (they record health pulses only);
        target-parented updates require a `value`.
      required:
        - id
        - type
        - parent_id
        - parent_type
        - value
        - health
        - note
        - creator_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^pru_[0-9a-f]{32}$'
          example: pru_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - progress_update
        parent_id:
          type: string
          nullable: true
          description: |
            The parent goal or target's `api_id`. Type disambiguated via
            the sibling `parent_type` field.
        parent_type:
          type: string
          enum:
            - goal
            - target
        value:
          type: number
          nullable: true
          description: Required when `parent_type` is `target`. Optional for goals.
        health:
          type: string
          nullable: true
          enum:
            - on_track
            - needs_attention
            - at_risk
        note:
          type: string
          nullable: true
        creator_id:
          type: string
          nullable: true
          pattern: '^per_[0-9a-f]{32}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProgressUpdateInput:
      type: object
      description: Input for creating a progress update on a goal or target.
      properties:
        progress:
          type: object
          properties:
            value:
              type: number
            health:
              type: string
              enum:
                - on_track
                - needs_attention
                - at_risk
            note:
              type: string


    SkillInput:
      type: object
      description: Input for creating or updating a skill.
      properties:
        skill:
          type: object
          properties:
            name:
              type: string
              maxLength: 255
            content:
              type: string
              description: Markdown content.
            tags:
              type: array
              items:
                type: string
              description: >
                Tag names to apply to the skill (case-insensitive). On update, the
                supplied array replaces the full tag set; pass [] to clear all
                tags, omit to leave tags unchanged. The well-known `specialist`
                tag marks a skill as invokable by a sub-agent.

    Strategy:
      type: object
      required:
        - type
        - body
        - inherited
        - inherited_from_role_id
      properties:
        type:
          type: string
          enum: [strategy]
        body:
          type: string
          nullable: true
          description: The strategy text. Null when no strategy is set and none is inherited.
        inherited:
          type: boolean
          description: True when the strategy is inherited from a parent circle.
        inherited_from_role_id:
          type: string
          nullable: true
          description: The role ID of the parent circle this strategy is inherited from.
          pattern: '^role_[0-9a-f]{32}$'

    StrategyInput:
      type: object
      required:
        - strategy
      properties:
        strategy:
          type: object
          required:
            - body
          properties:
            body:
              type: string
              description: The strategy text.

    # -- Response wrappers (Skills) --

    SkillListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SkillSummary'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'

    SkillDetailResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/SkillDetail'

    # -- Context schemas --

    ContextResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Context'

    Context:
      type: object
      required:
        - role
        - governance
        - org_skills
      properties:
        agent:
          $ref: '#/components/schemas/ContextAgent'
        role:
          $ref: '#/components/schemas/ContextRole'
        governance:
          $ref: '#/components/schemas/ContextGovernance'
        org_skills:
          type: array
          description: |
            Index of every skill in the org library (id + name only). Lets agents
            know what's available to load on demand via getSkill, beyond the
            skills already linked to their role.
          items:
            $ref: '#/components/schemas/ContextSkillIndex'

    ContextAgent:
      type: object
      description: Agent identity. Only present when the API key belongs to an agent.
      required:
        - id
        - name
        - kind
        - description
      properties:
        id:
          type: string
          pattern: '^agt_[0-9a-f]{32}$'
        name:
          type: string
        kind:
          type: string
          enum:
            - agent
        config:
          type: object
          nullable: true
          additionalProperties: true
          description: Agent configuration (runtime-specific).
        description:
          type: string
          description: Agent identity/soul description.
        context:
          type: string
          nullable: true
          description: Agent orientation/system prompt text.
        skills:
          type: array
          description: Agent-level skills (fetch full content via getSkill).
          items:
            $ref: '#/components/schemas/ContextSkillIndex'

    ContextOrgRules:
      type: object
      required:
        - constitution_version
        - sections
      properties:
        constitution_version:
          type: string
          example: '5.0'
        sections:
          type: array
          description: |
            The six rule sections that define the organization's governance,
            each with its chosen rule variant (HOLACRACY, UNIVERSAL,
            CENTRALIZED, CUSTOM, EXISTING, MODULAR_ADOPTION_BY_CIRCLE) and
            the corresponding rich content text.
          items:
            $ref: '#/components/schemas/ContextOrgRuleSection'

    ContextOrgRuleSection:
      type: object
      required:
        - key
        - title
        - type
      properties:
        key:
          type: string
          enum:
            - preamble
            - org_struct
            - duties
            - tactical
            - power_shift
            - governance
          description: Stable key identifying the section.
        title:
          type: string
          description: Human-readable section title.
        type:
          type: string
          enum:
            - HOLACRACY
            - UNIVERSAL
            - CENTRALIZED
            - CUSTOM
            - EXISTING
            - MODULAR_ADOPTION_BY_CIRCLE
          description: Which rule variant the organization has adopted for this section.
        summary:
          type: string
          description: |
            Brief summary of the section. Present for HOLACRACY sections
            (from locale). Absent for other types.
        content:
          type: string
          nullable: true
          description: |
            Inline content for short sections. Present for
            UNIVERSAL/CENTRALIZED/CUSTOM when text is under 500 characters,
            and for MODULAR_ADOPTION_BY_CIRCLE. Null for EXISTING.
            Absent for HOLACRACY (use content_url instead).
        content_url:
          type: string
          format: uri
          description: |
            URL to fetch the full section text. Present for HOLACRACY
            sections and for UNIVERSAL/CENTRALIZED/CUSTOM sections with
            content >= 500 characters.
        mcp_tool:
          type: string
          description: |
            MCP tool name to fetch the full section text on demand.
            Present when content_url is present.

    OrgRuleDetail:
      type: object
      required:
        - key
        - title
        - type
        - content
      properties:
        key:
          type: string
          enum:
            - preamble
            - org_struct
            - duties
            - tactical
            - power_shift
            - governance
        title:
          type: string
        type:
          type: string
          enum:
            - HOLACRACY
            - UNIVERSAL
            - CENTRALIZED
            - CUSTOM
            - EXISTING
            - MODULAR_ADOPTION_BY_CIRCLE
        content:
          type: string
          nullable: true
          description: Full text of the section. Null for EXISTING.

    ContextRole:
      type: object
      required:
        - id
        - type
        - name
        - purpose
        - accountabilities
        - domains
        - skills
        - notes
        - projects
        - actions
      properties:
        id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
        type:
          type: string
          enum:
            - role
        name:
          type: string
          nullable: true
        purpose:
          type: string
          nullable: true
        accountabilities:
          type: array
          items:
            $ref: '#/components/schemas/Accountability'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/DomainRef'
        skills:
          type: array
          description: Role-level skills (fetch full content via getSkill).
          items:
            $ref: '#/components/schemas/ContextSkillIndex'
        notes:
          type: array
          description: Notes on this role (title and excerpt).
          items:
            $ref: '#/components/schemas/ContextIndexEntry'
        projects:
          type: array
          description: Projects assigned to this role.
          items:
            $ref: '#/components/schemas/ContextIndexEntry'
        actions:
          type: array
          description: Actions assigned to this role.
          items:
            $ref: '#/components/schemas/ContextIndexEntry'

    ContextParentRole:
      type: object
      nullable: true
      description: The parent role this role belongs to, with its policies (null for anchor roles).
      properties:
        id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
        name:
          type: string
          nullable: true
        purpose:
          type: string
          nullable: true
        policies:
          type: array
          description: Policies from this role and ancestor roles.
          items:
            $ref: '#/components/schemas/ContextIndexEntry'

    ContextSkillIndex:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          pattern: '^skill_[0-9a-f]{32}$'
        name:
          type: string

    ContextGovernance:
      type: object
      required:
        - org_rules
        - ancestor_roles
        - sibling_roles
      properties:
        org_rules:
          $ref: '#/components/schemas/ContextOrgRules'
        parent_role:
          $ref: '#/components/schemas/ContextParentRole'
        ancestor_roles:
          type: array
          description: Chain of ancestor roles up to the anchor role.
          items:
            $ref: '#/components/schemas/ContextIndexEntry'
        sibling_roles:
          type: array
          description: Other roles in the same parent role.
          items:
            $ref: '#/components/schemas/ContextIndexEntry'

    ContextIndexEntry:
      type: object
      description: |
        A generic index entry pointing to a resource. Used throughout the context
        response for progressive disclosure — each entry identifies a resource and
        optionally links to its full-detail endpoint.
      required:
        - type
        - name
      properties:
        id:
          type: string
          description: Resource ID (TypeID format when available).
        type:
          type: string
          description: Resource type (role, policy, note, skill, project, action).
        name:
          type: string
          description: Display name or title.
        purpose:
          type: string
          description: Role purpose (present for role-type entries).
        excerpt:
          type: string
          description: Brief content excerpt (present for policies and notes).
        status:
          type: string
          description: Status (present for projects and actions).
        url:
          type: string
          description: API URL for full resource detail (when a v5 endpoint exists).

    # -- Proposals (governance) --

    Proposal:
      type: object
      required:
        - id
        - type
        - status
        - available_transitions
        - changes
        - response_summary
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^prp_[0-9a-f]{32}$'
        type:
          type: string
          enum: [proposal]
        status:
          type: string
          enum:
            - draft
            - proposed_outside_meeting
            - escalated
            - accepted
            - draft_with_conflicts
          description: |
            Current AASM state. Draft is the initial state;
            `proposed_outside_meeting` is the shortcut-path circulation state;
            `escalated` is queued for live meeting; `accepted` is terminal.
        tension_id:
          type: string
          nullable: true
          pattern: '^ten_[0-9a-f]{32}$'
        circle_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: |
            The `api_id` of the role that supports this proposal's circle.
            v5 is role-centric — circle references resolve to the circle's
            supported role.
        proposer_id:
          type: string
          nullable: true
          pattern: '^(per|agt)_[0-9a-f]{32}$'
        proposed_at:
          type: string
          nullable: true
          format: date-time
        response_deadline:
          type: string
          nullable: true
          format: date-time
        accepted_at:
          type: string
          nullable: true
          format: date-time
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ProposalChange'
        response_summary:
          type: object
          description: |
            Aggregate response counts. No per-person attribution is exposed —
            this is an intentional anti-political-pressure design decision to
            prevent back-channel pressure on whoever requested bring-to-meeting.
          required:
            - total
            - no_objection
            - bring_to_meeting
          properties:
            total:
              type: integer
              minimum: 0
              description: Total number of responses received.
            no_objection:
              type: integer
              minimum: 0
              description: Number of `no_objection` responses.
            bring_to_meeting:
              type: integer
              minimum: 0
              description: Number of `bring_to_meeting` responses.
        expected_response_count:
          type: integer
          minimum: 0
          description: |
            Number of circle members whose response is required for the
            proposal to auto-accept. Excludes the proposer and anyone added
            to the circle after `proposed_at`.
        received_response_count:
          type: integer
          minimum: 0
          description: |
            Number of expected responders who have submitted a response.
            When `received_response_count >= expected_response_count` and
            no responder has `bring_to_meeting`, the cron auto-accepts.
        available_transitions:
          type: array
          description: |
            Action names this caller may invoke on this proposal right now.
            Filtered by both current-state guards and caller authorization.
            Each name maps to a path: `POST /proposals/{id}/<name>`.
            Clients construct the URL — server returns names only.
          items:
            type: string
            enum: [propose, withdraw]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProposalChange:
      type: object
      description: |
        A governance command (create role, add accountability, update policy,
        etc.). Shape varies by change type — `type` is always present; other
        keys are free-form based on the command's schema.
      required:
        - type
      properties:
        id:
          type: string
          description: Stable identifier for the change within the proposal.
        type:
          type: string
          description: Change type (e.g., CreateRole, UpdateAccountability).
      additionalProperties: true

    ProposalVote:
      type: object
      description: |
        A governance vote on a proposal. No per-person attribution —
        summary stats only on the proposal resource.
      required:
        - id
        - type
        - proposal_status
        - value
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^prr_[0-9a-f]{32}$'
        type:
          type: string
          enum: [proposal_response]
        proposal_id:
          type: string
          nullable: true
          pattern: '^prp_[0-9a-f]{32}$'
        proposal_status:
          type: string
          description: |
            Current status of the parent proposal at the time of response.
            Useful when the response triggers auto-acceptance — the status
            will be `accepted` rather than `proposed_outside_meeting`.
          enum:
            - draft
            - proposed_outside_meeting
            - escalated
            - accepted
            - draft_with_conflicts
        value:
          type: string
          enum: [no_objection, bring_to_meeting]
          description: |
            * `no_objection` — willing to let the proposal pass as written.
            * `bring_to_meeting` — wants to discuss in a live governance
              meeting. Blocks auto-acceptance.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProposalRequest:
      type: object
      required:
        - proposal
      properties:
        proposal:
          type: object
          required:
            - tension_id
          properties:
            tension_id:
              type: string
              pattern: '^ten_[0-9a-f]{32}$'
            changes:
              type: array
              items:
                $ref: '#/components/schemas/ProposalChange'

    CreateProposalResponseRequest:
      type: object
      required:
        - response
      properties:
        response:
          type: object
          required:
            - value
          properties:
            value:
              type: string
              enum: [no_objection, bring_to_meeting]

    # -- Error --

    ProblemDetails:
      description: >-
        RFC 9457 Problem Details error object (backward-compatible successor to
        RFC 7807). All 4xx and 5xx responses from the API use this shape.
        Additional members may be present as RFC 9457 "extensions".
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type. Defaults to `about:blank`.
          example: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Not Found
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence.
          example: 404
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Not Found

  responses:
    BadRequest:
      description: >-
        The request was malformed — for example, `per_page` exceeds the maximum
        allowed value. The `detail` describes the specific issue.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: Not authorized to perform this action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: Resource not found or API v5 not enabled for this organization.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Conflict:
      description: |
        The request conflicts with the current state of the resource —
        for example, a business-rule violation or an ETag mismatch
        (resource modified since the `If-Match` value; re-fetch and retry).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    TooManyRequests:
      description: >-
        Rate limit exceeded. The `Retry-After` header indicates how many seconds
        to wait before retrying.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: "Rate limit exceeded. Try again in 42 seconds."

    UnprocessableEntity:
      description: Validation error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
