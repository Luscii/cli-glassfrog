  /roles/{role_id}/strategy:
    get:
      operationId: getRoleStrategy
      summary: Get strategy for a role
      description: |
        Returns the strategy for a role. If the role expands into a circle
        and that circle has no strategy of its own, it inherits from the
        nearest ancestor circle that does — `inherited` will be `true` and
        `inherited_from_role_id` identifies the source.

        Leaf roles (those without a supporting circle) return a null body
        with `inherited: false`.
      parameters:
        - name: role_id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
      responses:
        '200':
          description: The strategy for this circle.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Strategy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRoleStrategy
      summary: "Update strategy for a role's circle"
      description: |
        Sets or updates the strategy text for the circle backing this role.
        Requires circle admin or role-manage-without-proposal permission.
      parameters:
        - name: role_id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
