    ActionInput:
      type: object
      description: Input for creating or updating an action.
      properties:
        action_item:
          type: object
          properties:
            description:
              type: string
            status:
              type: string
              enum:
                - archived
                - cancelled
                - completed
                - current
                - scheduled
                - someday
                - waiting
            permissions:
              $ref: '#/components/schemas/PermissionsInput'
            trigger_event:
              type: string
            note:
              type: string
            individual_initiative:
              type: boolean
              default: false
              description: Whether the action is an individual initiative (not owned by a specific role).
            parent_project_id:
              type: string
              nullable: true
              pattern: '^proj_[0-9a-f]{32}$'
              description: Set the parent project by api_id. Pass null to unlink.

    Tension:
      type: object
      description: A tension sensed by a role filler.
      required:
        - id
        - type
        - body
        - status
        - role_id
        - sensed_by_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^ten_[0-9a-f]{32}$'
          example: ten_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - tension
        body:
          type: string
          nullable: true
          example: We ship work faster than we update the roadmap.
        status:
          type: string
          description: |
            Lifecycle state. `unprocessed` and `processed` are auto-computed from the
            presence of associated actions/projects/proposals/agenda-items. Clients
            can set `archived` explicitly via PATCH.
          enum:
            - unprocessed
            - processed
            - archived
          example: unprocessed
        role_id:
          type: string
          nullable: true
          description: The role that sensed this tension (column `impacted_role_id`; semantically the sensing role per app convention).
          pattern: '^role_[0-9a-f]{32}$'
        sensed_by_id:
          type: string
          nullable: true
          description: The person who sensed and captured this tension.
          pattern: '^per_[0-9a-f]{32}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        label:
          type: string
          nullable: true
        meeting_type:
          type: string
          nullable: true
          enum:
            - tactical
            - governance
            - null
        parent_role_id:
          type: string
          nullable: true
          description: The role id of the parent role this tension belongs to, if any.
          pattern: '^role_[0-9a-f]{32}$'

    TensionInput:
      type: object
      description: Input for creating or updating a tension.
      properties:
        tension:
          type: object
          properties:
            body:
              type: string
            label:
              type: string
            status:
              type: string
              enum:
                - unprocessed
                - processed
                - archived
            meeting_type:
              type: string
              nullable: true
              enum:
                - tactical
                - governance


    Goal:
      type: object
      description: |
        A goal (objective) on a role. Progress is computed on read as the mean
        of kept target progresses, clamped to `[0, 100]`. When a goal has no
        targets, progress is `null` (not `0`).
      required:
        - id
        - type
        - description
        - status
        - role_id
        - progress
        - has_supporting_goals
        - has_supporting_projects
        - parent_goal_id
        - start_date
        - end_date
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^goal_[0-9a-f]{32}$'
          example: goal_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - goal
        description:
          type: string
          example: Dominate the world
        status:
          type: string
          enum:
            - draft
            - approved
            - finished
        role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
        progress:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: |
            Mean of kept target progresses, rounded. `null` when the goal has
            no targets. Targets the caller can't see are still counted in the
            server-side rollup (the goal's progress is an org-level aggregate).
        has_supporting_goals:
          type: boolean
          description: Whether this goal has non-discarded child/supporting goals.
        has_supporting_projects:
          type: boolean
          description: Whether this goal has non-discarded, non-private supporting projects.
        parent_goal_id:
          type: string
          nullable: true
          pattern: '^goal_[0-9a-f]{32}$'
          description: |
            The `api_id` of the parent goal, or `null` if there is no parent.
            When multiple parents exist, returns one (non-deterministic).
        start_date:
          type: string
          nullable: true
          format: date
        end_date:
          type: string
          nullable: true
          format: date
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        targets:
          type: array
          description: |
            Targets (key results) under this goal. Only present when
            `?include=targets` is requested.
          items:
            $ref: '#/components/schemas/Target'
        supporting_projects:
          type: array
          description: |
            Projects linked as supporting this goal. Only present when
            `?include=supporting_projects` is requested.
          items:
            $ref: '#/components/schemas/Project'

    GoalInput:
      type: object
      description: Input for creating or updating a goal.
      properties:
        goal:
          type: object
          properties:
            description:
              type: string
            status:
              type: string
              enum:
                - draft
                - approved
                - finished
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
            date_range_id:
              type: integer

    Channel:
      type: object
      description: |
        A chat channel — 1:1 with a Role. Circle-role channels are group
        chats (members = circle role-fillers); leaf-role channels are
        DM-like (members = the role's own filler(s)).
      required:
        - id
        - type
        - role_id
        - integration_data
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^chn_[0-9a-f]{32}$'
          example: chn_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - channel
        role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: The bound role's api_id (any role — circle or leaf).
        integration_data:
          type: object
          additionalProperties: true
          description: >-
            Generic per-platform metadata container. Empty in this surface;
            populated by the multi-platform external-chat integration series
            (Slack/Teams/Discord adapters) to carry per-channel binding
            coordinates.
        viewer_last_read_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            The caller's newest read watermark on this channel (across the
            person-level and any role-scoped marks). Null when the caller
            has never marked the channel read.
        viewer_unread_count:
          type: integer
          nullable: true
          description: >-
            Count of messages newer than the caller's watermark (all
            messages when the watermark is null).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChannelListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'

    ChannelDetailResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Channel'

    ChannelReadStateResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - type
            - last_read_at
          properties:
            id:
              type: string
              pattern: '^chn_[0-9a-f]{32}$'
              description: The channel's api_id.
            type:
              type: string
              enum:
                - channel_read_state
            role_id:
              type: string
              nullable: true
              pattern: '^role_[0-9a-f]{32}$'
              description: Set when the watermark is role-scoped.
            last_read_at:
              type: string
              format: date-time

    Message:
      type: object
      description: A single post made by a Person into a Channel.
      required:
        - id
        - type
        - channel_id
        - from_person_id
        - body
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^msg_[0-9a-f]{32}$'
          example: msg_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - message
        channel_id:
          type: string
          pattern: '^chn_[0-9a-f]{32}$'
        from_person_id:
          type: string
          pattern: '^per_[0-9a-f]{32}$'
          description: The sending Person's api_id.
        from_role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: >-
            The role the sender posted as. Required for agent senders, optional
            for humans (auto-derived when the caller fills exactly one role in
            the channel's circle).
        body:
          type: string
          example: Welcome to the circle!
        parent_id:
          type: string
          nullable: true
          pattern: '^msg_[0-9a-f]{32}$'
          description: Optional parent message for simple threading.
        reply_to_id:
          type: string
          nullable: true
          pattern: '^msg_[0-9a-f]{32}$'
          description: Optional direct reply target.
        edited_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Set when the body has been edited. This is the entire edit-history
            surface — messages carry no revision log.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MessageListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'

    MessageDetailResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Message'

    MessageInput:
      type: object
      required:
        - message
      properties:
        message:
          type: object
          required:
            - body
          properties:
            body:
              type: string
              description: The message body (plain text; formatting rules TBD).
              example: Welcome to the circle!
            from_role:
              type: string
              pattern: '^role_[0-9a-f]{32}$'
              description: >-
                The role to post as (api_id). Required for agents; optional
                for humans when unambiguous.
            parent:
              type: string
              pattern: '^msg_[0-9a-f]{32}$'
              description: Optional parent message api_id (threading).
            reply_to:
              type: string
              pattern: '^msg_[0-9a-f]{32}$'
              description: Optional direct-reply message api_id.


    AgentSession:
      type: object
      description: |
        A record of an agent session, exactly as GlassFrog stored it.

        The fields are a projection of what the start/end lifecycle calls
        wrote — no liveness is computed on read. `status` is therefore the
        organization's *belief* about the session, which is precisely what
        makes it useful for reconciliation against host truth.
      required:
        - id
        - type
        - agent_id
        - role_id
        - assignment_id
        - topic
        - identifier
        - status
        - summary
        - started_at
        - ended_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^sess_[0-9a-f]{32}$'
          example: sess_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum: [agent_session]
        agent_id:
          type: string
          pattern: '^agt_[0-9a-f]{32}$'
          description: The agent this session belongs to.
        role_id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
          nullable: true
          description: >-
            The role the session was started for. Null for an agent-level
            session that is not scoped to any role.
        assignment_id:
          type: string
          pattern: '^asgn_[0-9a-f]{32}$'
          nullable: true
          description: The assignment backing a role session, when there is one.
        topic:
          type: string
          nullable: true
          description: >-
            Topic scoping the session, typically a ticket id. Null for a
            primary session. Several topic sessions may share one role.
        identifier:
          type: string
          nullable: true
          description: >-
            Client-supplied identifier for the session (for example a tmux
            session name). Free text, set by the caller at start and never
            server-generated, so it is only as meaningful and as unique as
            the caller made it. Filter on it to recover your own record.
        status:
          type: string
          enum: [active, ended]
          description: >-
            The stored lifecycle state. `active` means no end call was
            recorded — not that the session is verified running.
        summary:
          type: string
          nullable: true
          description: What the session accomplished. Written when it ends.
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: When the session was recorded as ended. Null while active.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: >-
            Last time the record changed. The closest available proxy for
            recency, but not a heartbeat — no heartbeat is recorded.

    AgentSessionListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentSession'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'

    Target:
      type: object
      description: |
        A target (key result) under a goal. Progress is computed on read via
        `(current_value - starting_value) / (ending_value - starting_value) * 100`,
        clamped to `[0, 100]`. Edge cases: starting/ending/current nulls → 0;
        `ending_value == starting_value` → 100 if current ≥ ending else 0.
      required:
        - id
        - type
        - description
        - status
        - goal_id
        - role_id
        - starting_value
        - ending_value
        - current_value
        - progress
        - value_prefix
        - value_suffix
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^tgt_[0-9a-f]{32}$'
          example: tgt_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - target
        description:
          type: string
          example: Ship it by Q4
        status:
          type: string
          enum:
            - draft
            - approved
            - finished
        goal_id:
          type: string
          nullable: true
          pattern: '^goal_[0-9a-f]{32}$'
        role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: |
            The role the target is assigned to. May differ from the parent
            goal's role (cross-circle target alignment is supported).
        starting_value:
          type: number
          nullable: true
        ending_value:
          type: number
          nullable: true
        current_value:
          type: number
          nullable: true
          description: |
            The value from the latest kept progress update on this target.
            Null when the target has no progress updates yet.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Computed percentage (see schema description for formula and edge cases).
        value_prefix:
          type: string
          nullable: true
          description: Optional unit prefix rendered before the value (e.g. `$`).
        value_suffix:
          type: string
          nullable: true
          description: Optional unit suffix rendered after the value (e.g. `%`).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TargetInput:
      type: object
      description: Input for creating or updating a target.
      properties:
        target:
          type: object
          properties:
            description:
              type: string
            status:
              type: string
              enum:
                - draft
                - approved
                - finished
            starting_value:
              type: number
            ending_value:
              type: number
            value_prefix:
              type: string
            value_suffix:
              type: string
            role_id:
              type: string
              pattern: '^role_[0-9a-f]{32}$'

    ProgressUpdate:
      type: object
      description: |
        A time-series health/value update on a goal or target. Goal-parented
        updates do not require a `value` (they record health pulses only);
        target-parented updates require a `value`.
      required:
        - id
        - type
        - parent_id
        - parent_type
        - value
        - health
        - note
        - creator_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^pru_[0-9a-f]{32}$'
          example: pru_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - progress_update
        parent_id:
          type: string
          nullable: true
          description: |
            The parent goal or target's `api_id`. Type disambiguated via
            the sibling `parent_type` field.
        parent_type:
          type: string
          enum:
            - goal
            - target
        value:
          type: number
          nullable: true
          description: Required when `parent_type` is `target`. Optional for goals.
        health:
          type: string
          nullable: true
          enum:
            - on_track
            - needs_attention
            - at_risk
        note:
          type: string
          nullable: true
        creator_id:
          type: string
          nullable: true
          pattern: '^per_[0-9a-f]{32}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProgressUpdateInput:
      type: object
      description: Input for creating a progress update on a goal or target.
      properties:
        progress:
          type: object
          properties:
            value:
              type: number
            health:
              type: string
              enum:
                - on_track
                - needs_attention
                - at_risk
            note:
              type: string


    SkillInput:
      type: object
      description: Input for creating or updating a skill.
      properties:
        skill:
          type: object
          properties:
            name:
              type: string
              maxLength: 255
            content:
              type: string
              description: Markdown content.
            tags:
              type: array
              items:
                type: string
              description: >
                Tag names to apply to the skill (case-insensitive). On update, the
                supplied array replaces the full tag set; pass [] to clear all
                tags, omit to leave tags unchanged. The well-known `specialist`
                tag marks a skill as invokable by a sub-agent.

    Strategy:
      type: object
      required:
        - type
        - body
        - inherited
        - inherited_from_role_id
      properties:
        type:
          type: string
          enum: [strategy]
        body:
          type: string
          nullable: true
          description: The strategy text. Null when no strategy is set and none is inherited.
        inherited:
          type: boolean
          description: True when the strategy is inherited from a parent circle.
        inherited_from_role_id:
          type: string
          nullable: true
          description: The role ID of the parent circle this strategy is inherited from.
          pattern: '^role_[0-9a-f]{32}$'

    StrategyInput:
      type: object
      required:
        - strategy
      properties:
        strategy:
          type: object
          required:
            - body
          properties:
            body:
              type: string
              description: The strategy text.

    # -- Response wrappers (Skills) --

