          $ref: '#/components/responses/NotFound'

    post:
      operationId: createGoalProgressUpdate
      summary: "Log a progress update on a goal"
      description: |
        Creates a new progress update for the goal (value + health + note).

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: goal_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^goal_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpdateInput'
      responses:
        '201':
          description: The created progress update.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProgressUpdate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /targets/{id}:
    get:
      operationId: getTarget
      summary: "Get a target"
      description: |
        Returns a single target by ID.

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^tgt_[0-9a-f]{32}$'
      responses:
        '200':
          description: A single target.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Target'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateTarget
      summary: "Update a target"
      description: |
        Returns 403 when the organization has goals disabled.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^tgt_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetInput'
      responses:
        '200':
          description: The updated target.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Target'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteTarget
      summary: "Soft-delete a target"
      description: |
        Returns 403 when the organization has goals disabled.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^tgt_[0-9a-f]{32}$'
      responses:
        '204':
          description: Target deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /targets/{target_id}/progress:
    get:
      operationId: listTargetProgressUpdates
      summary: "List progress updates for a target"
      description: |
        Returns the progress update history for a target, oldest stored first.

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^tgt_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/PerPageGoalsAndTargets'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A paginated list of progress updates.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProgressUpdate'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createTargetProgressUpdate
      summary: "Log a progress update on a target"
      description: |
        Creates a new progress update for the target (value + health + note).

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^tgt_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpdateInput'
      responses:
        '201':
          description: The created progress update.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProgressUpdate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /channels:
    get:
      operationId: listChannels
      summary: List channels
      description: |
        Returns the channels in the caller's organization. Channels are
        org-open: any org member can read and post to any channel. Each
        channel is a 1:1 wrapper around a Role, which defines the channel's
        audience (its members, used for notifications), not an access wall:

        * **Circle role** — members are the circle's role-fillers (group
          chat semantics).
        * **Leaf role** — members are the role's own filler(s) (DM-like).

        Membership in either case is derived dynamically from current
        assignments. Channels for a circle the caller participates in
        are provisioned lazily on first list/show; leaf-role channels
        are provisioned lazily on direct access.
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A paginated list of channels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /channels/{id}:
    get:
      operationId: getChannel
      summary: Get a channel
      description: |
        Returns a single channel by its api_id. For convenience, the bound
        role's api_id is also accepted (1:1 mapping), lazy-provisioning
        the channel row if it didn't exist yet.
      parameters:
        - name: id
          in: path
          required: true
          description: The channel's `chn_…` id, or the bound role's `role_…` id.
          schema:
            type: string
      responses:
        '200':
          description: A single channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /channels/{id}/read:
    post:
      operationId: markChannelRead
      summary: Mark a channel read
      description: |
        Advances the caller's read watermark on the channel to now (never
        rewinds). Unread state is computed from the caller's newest
        watermark — see the `viewer_last_read_at` / `viewer_unread_count`
        fields on Channel.

        Optionally scope the watermark to one of the caller's roles via
        `role` — multi-role actors (typically agents) can track which of
        their roles have caught up. The caller must currently fill the
        role (422 otherwise).
      parameters:
        - name: id
          in: path
          required: true
          description: The channel's `chn_…` id, or the bound role's `role_…` id.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  pattern: '^role_[0-9a-f]{32}$'
                  description: Optional role api_id to scope the watermark to.
      responses:
        '200':
          description: The caller's updated read state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelReadStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /channels/{channel_id}/messages:
    get:
      operationId: listChannelMessages
      summary: List messages in a channel
      description: |
        Returns a paginated list of messages in a channel, oldest stored
        first. Use `cursor` + `per_page` for pagination. Soft-deleted
        messages are omitted.
      parameters:
        - name: channel_id
          in: path
          required: true
          description: The channel's id (accepts channel or role api_id).
          schema:
            type: string
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A paginated list of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createChannelMessage
      summary: Post a message to a channel
      description: |
        Creates a new message in the channel.

        Agents must post as a specific role via `from_role`. Humans may
        omit `from_role` when they fill exactly one role in the channel's
        circle; otherwise it must be specified.

        (Notification fan-out for channel messages arrives in a follow-up
        release on the event substrate; unread state is watermark-based —
        see `POST /channels/{id}/read`.)
      parameters:
        - name: channel_id
          in: path
          required: true
          description: The channel's id (accepts channel or role api_id).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
      responses:
        '201':
          description: The created message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /messages/{id}:
    patch:
      operationId: updateMessage
      summary: Edit a message
      description: |
        Edits a message body. Author-only. Sets `edited_at` so clients can
        render an edited marker — messages carry no further revision
        history by design.
      parameters:
        - name: id
          in: path
          required: true
          description: The message's `msg_…` id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
      responses:
        '200':
          description: The updated message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteMessage
      summary: Delete a message
      description: |
        Soft-deletes a message. Author-only. Replies keep their threading
        pointers; deleted messages are omitted from lists.
      parameters:
        - name: id
          in: path
          required: true
          description: The message's `msg_…` id.
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions:
    get:
      operationId: listSessions
      summary: List agent sessions
      description: |
        Returns a paginated list of agent session records across the
        organization, filtered by visibility: an agent sees only its own
        sessions, a human operator sees sessions of the agents they operate,
        and an org admin sees every session in the org.

        Records are returned **as stored**. `status` reflects what was
        recorded by the start/end lifecycle calls — nothing here checks
        whether a session is really still running on its host. A record
        reading `active` may correspond to a process that died without
        ending its session; surfacing that disagreement is the point of the
        endpoint, so the read path deliberately does not "correct" it.
        Server-side expiry of stale records is tracked separately.

        There is no `last_heartbeat_at` field — no such data is recorded.
        `updated_at` is the closest last-touch proxy and is not a heartbeat.
      parameters:
        - name: status
          in: query
          required: false
          description: |
            Limit to sessions in this state. `active` is the reconciliation
            query — it pulls just the open records. Any other value returns
            `422 Unprocessable Entity`.
          schema:
            type: string
            enum: [active, ended]
        - name: agent_id
          in: query
          required: false
          description: Limit to sessions belonging to this agent.
          schema:
            type: string
            pattern: '^agt_[0-9a-f]{32}$'
        - name: role_id
          in: query
          required: false
          description: Limit to sessions started for this role.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - name: topic
          in: query
          required: false
          description: Exact match on the session's topic (e.g. a ticket id).
          schema:
            type: string
        - name: identifier
          in: query
          required: false
          description: |
            Exact match on the client-supplied identifier. Lets a caller that
            knows its own identifier look up its own record — and so recover
            its `sess_…` id — without guessing.
          schema:
            type: string
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A paginated list of agent sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'


components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Your GlassFrog API v5 key.
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        The same GlassFrog API v5 key, sent in the `Authorization` header as
        `Authorization: Bearer <your_v5_api_key>`. Provided as an alias to
        `X-Auth-Token` for hosted clients that cannot send a custom header.

        This is an API key transported in the `Authorization` header — NOT
        OAuth Bearer semantics. The value is your static v5 API key: it does
        not expire, carry scopes, or support refresh.

        Precedence: if both `X-Auth-Token` and `Authorization: Bearer` are
        sent, `X-Auth-Token` is used. An invalid `X-Auth-Token` is rejected
        and never falls back to `Authorization`.

  headers:
    ETag:
      description: |
        Hash of the resource's current state. Pass this value back as
        `If-Match` on subsequent PUT/PATCH requests to enable optimistic
        concurrency checking.
      schema:
        type: string
        example: '"a1b2c3d4e5f6..."'
    RateLimitLimit:
      description: Maximum requests allowed in the current window.
      schema:
        type: integer
        example: 50
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        example: 47
    RateLimitReset:
      description: Unix epoch timestamp when the current window resets.
      schema:
        type: integer
        example: 1714600800
    RetryAfter:
      description: Seconds to wait before retrying (present on 429 responses).
      schema:
        type: integer
        example: 42

  parameters:
    PerPage:
      name: per_page
      in: query
      description: >-
        Number of results per page (1–500, default 100). Values above the maximum
        return `400 Bad Request`; blank, zero, negative, or non-numeric values fall
        back to the default of 100.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

    PerPageGoalsAndTargets:
      name: per_page
      in: query
      description: >-
        Number of results per page for the goal and target endpoints. Omit
        `per_page` and these endpoints return 25 records. The maximum is 500; a
        larger value returns `400 Bad Request`. A blank, zero, negative, or
        non-numeric value is not rejected — it sets the page size to 100, not to
        25.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 25

    Cursor:
      name: cursor
      in: query
      description: Cursor from a previous response's `meta.pagination.next_cursor`.
      schema:
        type: string

    Locale:
      name: locale
      in: query
      description: |
        Override the response locale. Affects localized fields such as core
        role names. Resolution order: this param > subdomain > org default >
        app default (en).
      schema:
        type: string
        example: fr

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        ETag from a previous GET response. When present, the server checks
        that the resource has not been modified since your read. If the ETag
        is stale, a 409 Conflict is returned. Omit this header for
        unconditional (last-write-wins) updates.
      schema:
        type: string
        example: '"a1b2c3d4e5f6..."'

    Q:
      name: q
      in: query
      description: |
        Full-text search filter. Matches against the resource's searchable text
        fields using Postgres full-text search (`simple` + `unaccent`). Supports
        Google-style syntax: `marketing -intern`, `"exact phrase"`, `foo OR bar`.
        Composes with other filters (all AND'd together). Empty or whitespace-only
        values are ignored. Malformed queries return no rows rather than an error.
      schema:
        type: string
      example: marketing

    IncludeLegacyId:
      name: include_legacy_id
      in: query
      required: false
      description: |
        **Transition-only.** When `true`, each resource in the response
        additionally carries a `legacy_id` field — its v3 sequential integer id
        — so v3-keyed integrators can correlate v5 TypeIDs with the numeric IDs
        they already hold during migration. Default is off (`legacy_id` is
        omitted unless explicitly requested).

        This is a temporary v3→v5 bridge and **NOT a permanent part of the v5
        contract**: it retires when the v3 API retires. See the "Legacy IDs
        (transition-only)" section in the API overview. Applies to the standard
        resource list/show endpoints and `/me`; nested `?include=` embeds are
        out of scope.
      schema:
        type: boolean
        default: false
      example: true

  schemas:
    # -- Pagination --

    Pagination:
      type: object
      required:
        - per_page
        - has_next_page
      properties:
        per_page:
          type: integer
          example: 100
        has_next_page:
          type: boolean
        next_cursor:
          type: string
          description: Present when `has_next_page` is true. Pass as `?cursor=` to fetch the next page.

    # -- Shared sub-resources (always inline) --

    Accountability:
      type: object
      required:
        - id
        - description
        - is_structural
      properties:
        id:
          type: string
          pattern: '^acct_[0-9a-f]{32}$'
          example: acct_0123456789abcdef0123456789abcdef
        description:
          type: string
          description: >-
            For structural (constitutional) accountabilities, resolved from
            the Holacracy Constitution in the request locale. For custom
            accountabilities, the org-defined description.
          example: Defining coding standards for the team
        is_structural:
          type: boolean
          description: >-
            True for constitutional accountabilities defined by the Holacracy
            Constitution (e.g., Facilitator's meeting facilitation duties).
            False for org-defined custom accountabilities.
          example: false

    DomainRef:
      type: object
      required:
        - id
        - description
        - is_structural
      properties:
        id:
          type: string
          pattern: '^dom_[0-9a-f]{32}$'
          example: dom_0123456789abcdef0123456789abcdef
        description:
          type: string
          description: >-
            For structural (constitutional) domains, resolved from the
            Holacracy Constitution in the request locale. For custom
            domains, the org-defined description.
          example: Company website
        is_structural:
          type: boolean
          description: >-
            True for constitutional domains defined by the Holacracy
            Constitution. False for org-defined custom domains.
          example: false

    # -- Role schemas --

    Role:
      type: object
      description: A role in the organization.
      required:
        - id
        - type
        - name
        - purpose
        - parent_role_id
        - original_role_id
        - has_subroles
        - flags
        - accountabilities
        - domains
        - fillers
        - tags
      properties:
        id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
          example: role_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - role
        legacy_id:
          type: integer
          nullable: true
          description: >-
            **Transition-only.** The role's v3 sequential integer id, present
            ONLY when `?include_legacy_id=true` is passed. A v3→v5 migration
            bridge for correlating TypeIDs with the numeric IDs integrators
            already hold; NOT a permanent part of the v5 contract — this field
            retires when the v3 API retires. See the "Legacy IDs" section in the
            API overview.
          example: 38655
        name:
          type: string
          example: Circle Lead
          nullable: true
          description: |
            Localized display name. For core roles, applies the organization's
            custom term overrides first, then locale-based translation (via
            `?locale=` param, subdomain, or org default). Custom roles pass
            through unchanged.
        purpose:
          type: string
          nullable: true
          example: Steering the role toward its purpose
        parent_role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: ID of the parent role. Null for anchor roles.
        original_role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: |
            ID of the role this role derives from — its original role.
            Non-null on linked roles (which surface `linked` in `flags`) and
            focus roles; `null` for all other roles. A cross-linked role
            appears as two v5 records with different `id`s; the linked record
            points here at its original, letting a consumer correlate the two.
        has_subroles:
          type: boolean
          description: Whether this role is expanded with subroles.
        flags:
          type: array
          items:
            type: string
            enum:
              - structural
              - elected
              - linked
          description: |
            Classification flags. `structural` = core Holacracy role,
            `elected` = filled by election, `linked` = cross-linked from another role.
        accountabilities:
          type: array
          items:
            $ref: '#/components/schemas/Accountability'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/DomainRef'
        fillers:
          type: array
          items:
            $ref: '#/components/schemas/Actor'
          description: People and agents currently filling this role.
        tags:
          type: array
          items:
            type: string
          description: Tag names applied to this role.
          example:
            - marketing
            - q2

    RoleDetail:
      description: A role with optional included resources (detail view).
      allOf:
        - $ref: '#/components/schemas/Role'
        - type: object
          properties:
            assignments:
              type: array
              items:
                $ref: '#/components/schemas/Assignment'
              description: Present when `?include=assignments` is requested.
            subroles:
              type: array
              items:
                $ref: '#/components/schemas/Role'
              description: Present when `?include=subroles` is requested.
            parent_role:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Role'
              description: Present when `?include=parent_role` is requested. Null for anchor roles.
            policies:
              type: array
              items:
                $ref: '#/components/schemas/Policy'
              description: Present when `?include=policies` is requested.
            notes:
              type: array
              items:
                $ref: '#/components/schemas/Note'
              description: Present when `?include=notes` is requested.
            skills:
              type: array
              items:
                $ref: '#/components/schemas/SkillSummary'
              description: >
                Present when `?include=skills` is requested. Returns skill
                summaries (no `content`); fetch full content on demand via
                `GET /skills/{id}`.

    TreeNode:
      type: object
      description: |
        A role in the tree response. `children` is always present (possibly
        empty). `accountabilities`, `domains`, `fillers`, and `assignments`
        are present only when their corresponding `?include=` value is set.
      required:
        - id
        - type
        - name
        - purpose
        - parent_role_id
        - original_role_id
        - has_subroles
        - flags
        - children
      properties:
        id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
        type:
          type: string
          enum:
            - role
        name:
          type: string
          nullable: true
        purpose:
          type: string
          nullable: true
        parent_role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: |
            ID of the parent role. Null for the anchor role. Present on every
            node even though nesting is already conveyed by `children`, so
            that consumers who flatten the tree to a list retain the edge.
        original_role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: |
            ID of the role this node derives from — its original role.
            Non-null on linked roles (which surface `linked` in `flags`) and
            focus roles; `null` for all other roles.
        has_subroles:
          type: boolean
        flags:
          type: array
          items:
            type: string
            enum:
              - structural
              - elected
              - linked
        children:
          type: array
          description: |
            Direct children of this node, each of which is itself a
            `TreeNode`. Empty array when the node is a leaf, when `?depth`
            truncates beneath it, or when all children are hidden by
            authorization.
          items:
            $ref: '#/components/schemas/TreeNode'
        accountabilities:
          type: array
          items:
            $ref: '#/components/schemas/Accountability'
          description: Present when `?include=accountabilities` is requested.
        domains:
          type: array
          items:
            $ref: '#/components/schemas/DomainRef'
          description: Present when `?include=domains` is requested.
        fillers:
          type: array
          items:
            $ref: '#/components/schemas/Actor'
          description: Present when `?include=members` is requested.
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
          description: Present when `?include=assignments` is requested.

    Assignment:
      type: object
      description: |
        A role assignment. `role_id` and `actor_id` are always present.
        Use `?include=actor` or `?include=role` to embed the full related object.
      required:
        - id
        - type
        - role_id
        - actor_id
        - focus
        - elected_until
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^asgn_[0-9a-f]{32}$'
          example: asgn_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum: [assignment]
        role_id:
          type: string
          description: The role being filled. Always present.
          pattern: '^role_[0-9a-f]{32}$'
          example: role_0123456789abcdef0123456789abcdef
        actor_id:
          type: string
          description: The person or agent filling the role. Always present.
          example: per_0123456789abcdef0123456789abcdef
        focus:
          type: string
          nullable: true
          description: Optional focus area for the assignment.
        elected_until:
          type: string
          format: date
          nullable: true
          description: Election expiry date, if applicable.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        actor:
          type: object
          description: Present when `?include=actor` is requested (default from `/roles/{id}/assignments`).
          required: [id, name, email, kind]
          properties:
            id:
              type: string
              description: The person or agent API ID.
              example: per_0123456789abcdef0123456789abcdef
            name:
              type: string
              description: Display name of the actor.
              example: Alice Smith
            email:
              type: string
              nullable: true
              description: The actor's email address. Present for human actors; null for agents.
            kind:
              type: string
              enum: [human, agent]
              description: Whether the actor is a human or an AI agent.
        role:
          type: object
          description: Present when `?include=role` is requested (default from `/actors/{id}/assignments`).
          required: [id, type, name]
          properties:
            id:
              type: string
              pattern: '^role_[0-9a-f]{32}$'
            type:
              type: string
              enum: [role]
            name:
              type: string
            purpose:
              type: string
              nullable: true
            parent_role_id:
              type: string
              nullable: true
              pattern: '^role_[0-9a-f]{32}$'


    # -- Policy schemas (standalone endpoints) --

    Policy:
      type: object
      description: A policy with full body content.
      required:
        - id
        - type
        - title
        - body
        - role_id
        - domain_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^pol_[0-9a-f]{32}$'
          example: pol_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - policy
        title:
          type: string
          example: All PRs require two approvals
        body:
          type: string
          nullable: true
          description: The full policy body text (may contain HTML).
        role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: The role this policy governs. Null for role-level policies.
        domain_id:
          type: string
          nullable: true
          pattern: '^dom_[0-9a-f]{32}$'
          description: The domain this policy is scoped to. Null if the policy applies to the whole role.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # -- Domain schemas (standalone endpoints) --

    Domain:
      type: object
      description: A domain resource.
      required:
        - id
        - type
        - description
        - role_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^dom_[0-9a-f]{32}$'
          example: dom_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - domain
        description:
          type: string
          example: Code review standards
        role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: The role that controls this domain.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
          description: Present when `?include=policies` is requested.


    # -- Note schemas (standalone endpoints) --

    Permissions:
      type: object
      description: >-
        Effective permissions for a resource. The `view` and `manage` fields
        report the permission group that applies, resolved for the org's
        public/private status.
      required:
        - view
        - manage
      properties:
        view:
          type: string
          enum: [public, org_member, peer_roles]
          description: >-
            Who can see this record. Resolved based on the org's
            public/private status (e.g., `visible_to_all` on a public org
            reports as `public`, on a private org as `org_member`).
        manage:
          type: string
          enum: [peer_roles]
          description: Who can edit/delete this record.

    PermissionsInput:
      type: object
      description: >-
        Optional permissions override. Omit to use defaults.
      properties:
        view:
          type: string
          enum: [public, org_member, peer_roles]
          description: >-
            Who can see this record. `public`/`org_member` map to the default
            visibility; `peer_roles` restricts to peer role holders in the circle.

    Note:
      type: object
      description: A note on a role.
      required:
        - id
        - type
        - title
        - body
        - role_id
        - permissions
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^rnot_[0-9a-f]{32}$'
          example: rnot_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - note
        title:
          type: string
          example: How to run the deploy process
        body:
          type: string
          description: Full markdown content of the note.
        role_id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
        permissions:
          $ref: '#/components/schemas/Permissions'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time


    NoteInput:
      type: object
      description: Input for creating or updating a note.
      properties:
        note:
          type: object
          properties:
            title:
              type: string
              maxLength: 255
            body:
              type: string
              description: Markdown content.
            permissions:
              $ref: '#/components/schemas/PermissionsInput'

    NoteListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'

    # -- Project schemas --

    Project:
      type: object
      description: A project on a role (list view).
      required:
        - id
        - type
        - description
        - status
        - role_id
        - individual_initiative
        - has_sub_projects
        - has_actions
        - parent_project_id
        - tags
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^proj_[0-9a-f]{32}$'
          example: proj_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - project
        description:
          type: string
          example: Rebuild onboarding flow
        status:
          type: string
          enum:
            - archived
            - cancelled
            - completed
            - current
            - scheduled
            - someday
            - waiting
        role_id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
          description: The role that owns this project. Null for non-role-owned projects.
        individual_initiative:
          type: boolean
          description: Whether the project is an individual initiative (not owned by a specific role).
        has_sub_projects:
          type: boolean
          description: Whether this project has non-discarded sub-projects.
        has_actions:
          type: boolean
          description: Whether this project has non-discarded actions.
        parent_project_id:
          type: string
          nullable: true
          pattern: '^proj_[0-9a-f]{32}$'
          description: The api_id of the parent project, or null if there is no parent.
        tags:
          type: array
          items:
            type: string
          description: Tag names applied to this project.
          example:
            - marketing
            - q2
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sub_projects:
          type: array
          description: |
            Direct child projects. Only present when `?include=sub_projects`
            is requested.
          items:
            $ref: '#/components/schemas/Project'
        actions:
          type: array
          description: |
            Actions belonging to this project. Only present when
            `?include=actions` is requested.
          items:
            $ref: '#/components/schemas/Action'
        link:
          type: string
          nullable: true
          description: External link associated with the project.
        note:
          type: string
          nullable: true
          description: Internal note on the project.
        value:
          type: number
          nullable: true
          description: Perceived value rating.
        effort:
          type: number
          nullable: true
          description: Estimated effort rating.
        permissions:
          $ref: '#/components/schemas/Permissions'

    ProjectInput:
      type: object
      description: Input for creating or updating a project.
      properties:
        project:
          type: object
          properties:
            description:
              type: string
            status:
              type: string
              enum:
                - archived
                - cancelled
                - completed
                - current
                - scheduled
                - someday
                - waiting
            link:
              type: string
            note:
              type: string
            value:
              type: number
            effort:
              type: number
            individual_initiative:
              type: boolean
              default: false
              description: Whether the project is an individual initiative (not owned by a specific role).
            parent_project_id:
              type: string
              nullable: true
              pattern: '^proj_[0-9a-f]{32}$'
              description: Set the parent project by api_id. Pass null to clear.
            permissions:
              $ref: '#/components/schemas/PermissionsInput'

    # -- Custom Field schemas --

    CustomField:
      type: object
      description: A custom field on a role.
      required:
        - id
        - type
        - field_name
        - field_value
        - role_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^cf_[0-9a-f]{32}$'
          example: cf_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - custom_field
        field_name:
          type: string
          example: KPIs
        field_value:
          type: string
          example: Revenue growth, customer satisfaction
        role_id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CustomFieldInput:
      type: object
      description: Input for creating or updating a custom field.
      properties:
        custom_field:
          type: object
          properties:
            field_name:
              type: string
            field_value:
              type: string

    # -- Search schemas --

    SearchResult:
      type: object
      required:
        - type
        - id
        - title
        - excerpt
        - rank
      properties:
        type:
          type: string
          description: The resource type.
          enum:
            - role
            - note
            - project
            - action
            - skill
            - actor
            - policy
            - domain
        id:
          type: string
          description: The resource's unique identifier.
        title:
          type: string
          description: The resource's title or name.
        excerpt:
          type: string
          nullable: true
          description: A highlighted excerpt from the matching content.
        rank:
          type: number
          format: float
          description: Relevance rank score.
        role_id:
          type: string
          nullable: true
          description: The owning role's API ID, when applicable.

    # -- Tag schemas --

    Tag:
      type: object
      description: An organization-scoped tag.
      required:
        - id
        - type
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier with `tag_` prefix.
          example: tag_0123456789abcdef0123456789abcdef
          pattern: '^tag_[0-9a-f]{32}$'
        type:
          type: string
          enum:
            - tag
        name:
          type: string
          example: marketing
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TagInput:
      type: object
      description: Input for creating or updating a tag.
      properties:
        tag:
          type: object
          properties:
            name:
              type: string

    PersonInput:
      type: object
      description: Input for inviting or updating a person.
      properties:
        person:
          type: object
          properties:
            name:
              type: string
              description: The person's display name.
              example: Alice Smith
            email:
              type: string
              format: email
              description: The person's email address.
              example: alice@example.com
            admin:
              type: boolean
              description: Whether to grant org admin access. Requires caller to be an org admin.

    # -- Actor schemas --

    Actor:
      type: object
      description: A person or agent in the organization.
      required:
        - id
        - type
        - name
        - email
        - kind
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier. `per_` prefix for humans, `agt_` for agents.
          example: per_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - actor
        legacy_id:
          type: integer
          nullable: true
          description: >-
            **Transition-only.** The actor's v3 sequential integer person id,
            present ONLY when `?include_legacy_id=true` is passed. Null for
            actors backed by agents (agents have no v3 representation). A
            v3→v5 migration bridge for correlating TypeIDs with the numeric IDs
            integrators already hold; NOT a permanent part of the v5 contract —
            this field retires when the v3 API retires. See the "Legacy IDs"
            section in the API overview.
          example: 38655
        name:
          type: string
          example: Alice Smith
        email:
          type: string
          nullable: true
          description: The actor's email address. Present for human actors; null for agents.
          example: alice@example.com
        kind:
          type: string
          enum:
            - human
            - agent
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: Present when `?include=roles` is requested. Full role shape.
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
          description: Present when `?include=assignments` is requested. Same shape as on roles.


    Organization:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          pattern: '^org_[0-9a-f]{32}$'
        name:
          type: string
        legacy_id:
          type: integer
          nullable: true
          description: >-
            **Transition-only.** The organization's v3 sequential integer id
            (the numeric org id shown in the web UI, e.g. 38655), present ONLY
            when `?include_legacy_id=true` is passed. Surfaced on `/me`. A
            v3→v5 migration bridge for correlating TypeIDs with the numeric IDs
            integrators already hold; NOT a permanent part of the v5 contract —
            this field retires when the v3 API retires. See the "Legacy IDs"
            section in the API overview.
          example: 38655

    Membership:
      type: object
      description: A person's membership in an organization.
      required:
        - id
        - type
        - actor_id
        - organization_id
        - access_level
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^mem_[0-9a-f]{32}$'
        type:
          type: string
          enum:
            - membership
        legacy_id:
          type: integer
          nullable: true
          description: >-
            **Transition-only.** The membership's v3 sequential integer id,
            present ONLY when `?include_legacy_id=true` is passed. A v3→v5
            migration bridge; NOT a permanent part of the v5 contract — this
            field retires when the v3 API retires. See the "Legacy IDs" section
            in the API overview.
          example: 91827
        actor_id:
          type: string
          description: The member (person or agent).
        organization_id:
          type: string
          pattern: '^org_[0-9a-f]{32}$'
        access_level:
          type: string
          enum:
            - admin
            - normal
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MeResponse:
      type: object
      description: Authenticated actor bundled with org context, wrapped in the standard v5 envelope.
      required:
        - data
      properties:
        data:
          type: object
          required:
            - actor
            - organization
            - membership
          properties:
            actor:
              $ref: '#/components/schemas/Actor'
            organization:
              $ref: '#/components/schemas/Organization'
            membership:
              $ref: '#/components/schemas/Membership'
            roles:
              type: array
              description: Present when `?include=roles` is requested. Same shape as `GET /roles`.
              items:
                $ref: '#/components/schemas/Role'

    AgentContextResponse:
      type: object
      description: |
        Self / agent context orientation. Returned by `GET /me/context` and
        `GET /agents/{id}/context`. Filled roles are inlined so one call
        provides enough context to orient. The `agent` section is present only
        when the subject is an agent — `GET /me/context` omits it for human
        callers; agent-level skills within it are referenced by ID (fetch full
        content via `/skills/{id}`).
      required:
        - roles
      properties:
        agent:
          $ref: '#/components/schemas/ContextAgent'
        roles:
          type: array
          description: The roles this agent fills via primary, non-discarded assignments.
          items:
            $ref: '#/components/schemas/AgentContextRole'

    AgentContextRole:
      type: object
      description: A role an agent fills — inline identity only, no definition.
      required:
        - id
        - name
      properties:
        id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
        name:
          type: string
        circle_name:
          type: string
          nullable: true
          description: Name of the parent circle, if any.

    # -- Skill schemas --

    SkillSummary:
      type: object
      description: >
        A skill as returned in list responses. Omits the full markdown
        `content` to keep list payloads small — fetch full content on demand
        via `GET /skills/{id}`.
      required:
        - id
        - type
        - name
        - tags
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^skill_[0-9a-f]{32}$'
          example: skill_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - skill
        name:
          type: string
          example: Code Review Standards
        tags:
          type: array
          items:
            type: string
          description: >
            Tag names applied to this skill, sorted alphabetically.
            Tags are free-form strings organized by convention.
            The well-known `specialist` tag marks a skill as invokable by a sub-agent.
          example:
            - specialist
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Skill:
      description: A skill including the full markdown body.
      allOf:
        - $ref: '#/components/schemas/SkillSummary'
        - type: object
          required:
            - content
          properties:
            content:
              type: string
              nullable: true
              description: The full markdown content of the skill.

    SkillDetail:
      description: A skill with optional included resources.
      allOf:
        - $ref: '#/components/schemas/Skill'
        - type: object
          properties:
            roles:
              type: array
              items:
                $ref: '#/components/schemas/Role'
              description: Present when `?include=roles` is requested.


    # -- Action schemas --

    ChecklistItem:
      type: object
      description: A checklist item on a role.
      required:
        - id
        - type
        - description
        - frequency
        - role_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^chck_[0-9a-f]{32}$'
          example: chck_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - checklist_item
        description:
          type: string
          nullable: true
          example: Weekly review completed
        frequency:
          type: string
          nullable: true
          enum:
            - Weekly
            - Monthly
            - Quarterly
          example: Weekly
        role_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        link:
          type: string
          nullable: true
        global:
          type: boolean
        permissions:
          $ref: '#/components/schemas/Permissions'

    ChecklistItemInput:
      type: object
      description: Input for creating or updating a checklist item.
      properties:
        checklist_item:
          type: object
          properties:
            description:
              type: string
            frequency:
              type: string
              enum:
                - Weekly
                - Monthly
                - Quarterly
            link:
              type: string
            permissions:
              $ref: '#/components/schemas/PermissionsInput'

    Metric:
      type: object
      description: A metric on a role.
      required:
        - id
        - type
        - description
        - frequency
        - role_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^mtrc_[0-9a-f]{32}$'
          example: mtrc_0123456789abcdef0123456789abcdef
        type:
          type: string
          enum:
            - metric
