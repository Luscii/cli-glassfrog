        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteRoleStrategy
      summary: "Clear strategy for a role's circle"
      description: |
        Removes the circle's own strategy. If a parent circle has a strategy,
        subsequent reads will show the inherited value. Requires circle admin
        or role-manage-without-proposal permission.
