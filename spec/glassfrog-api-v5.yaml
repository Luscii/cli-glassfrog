  /search:
    get:
      operationId: search
      summary: "Cross-model full-text search"
      description: |
        Search across multiple resource types (roles, projects, actions,
        notes, skills, actors, policies, domains) using Postgres full-text
        search. Results are ranked by relevance.
      parameters:
        - name: query
          in: query
          required: true
          description: The search query string. Supports websearch syntax.
          schema:
            type: string
            example: onboarding
        - name: types
          in: query
          required: false
          description: |
            Comma-separated list of resource types to search. Defaults to all
            types. Valid values: role, note, project, action, skill, actor,
            policy, domain.
          schema:
            type: string
            example: role,project
        - name: include_agent_content
          in: query
          required: false
          description: |
            Include agent-authored notes in the results. Defaults to false, so
            notes owned by an agent are excluded. A note is agent-authored when
            its current owner — its creator, or whoever last edited it — is an agent.
          schema:
            type: boolean
            default: false
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of search results ranked by relevance.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

