  /projects/{id}/sub_projects:
    get:
      operationId: listSubProjects
      summary: "List direct child projects of a project"
      description: |
        Returns a paginated list of projects whose `parent_project_id` is the
        given project. Direct children only — callers should recurse client-side
        if they need the full descendant tree.
      parameters:
        - name: id
          in: path
