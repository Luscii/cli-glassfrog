          description: Filter to actors filling a specific role.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - name: email
          in: query
          description: Filter by exact email address (case-insensitive). Returns actors matching the given email within the caller's organization.
          schema:
            type: string
            format: email
      responses:
        '200':
          description: A paginated list of actors.
