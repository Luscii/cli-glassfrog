  # -- Goals (Premium) --
  #
  # Every goals/targets/progress_updates endpoint is feature-gated by
  # `organization.goals_enabled?` (which requires `goals_available?` —
  # a premium add-on). Returns 403 when the feature is not available.

  /roles/{role_id}/goals:
    get:
      operationId: listRoleGoals
      summary: "List goals for a role"
      description: |
        Returns a paginated list of goals owned by a role.

        Use `?include=targets,supporting_projects` to embed related
        resources on each goal in the response.

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: role_id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - name: include
          in: query
          description: |
            Comma-separated list of associations to embed on each goal.
            Unknown values are silently ignored.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - targets
                - supporting_projects
      responses:
        '200':
          description: A paginated list of goals.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Goal'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createRoleGoal
      summary: "Create a goal on a role"
      description: |
        Creates a new goal owned by the specified role.

        Returns 403 when the organization has goals disabled.
      parameters:
        - name: role_id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalInput'
      responses:
        '201':
          description: The created goal.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

