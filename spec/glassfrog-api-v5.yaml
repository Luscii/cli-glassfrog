        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    delete:
      operationId: deleteTension
      summary: "Delete a tension"
      description: |
        Soft-deletes the tension (sets `discarded_at`). Proposals associated
        with the tension are not cascaded; delete those separately if needed.

        **Not idempotent in the REST-strict sense.** First DELETE on a live
        tension returns 204; subsequent calls return 404 (an already-discarded
        tension is indistinguishable from a never-existed one). Treat
        404-following-204 as success.
      parameters:
        - name: id
          in: path
          required: true
          description: The tension's unique identifier.
          schema:
            type: string
            pattern: '^ten_[0-9a-f]{32}$'
      responses:
        '204':
          description: Tension deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

