          description: Agent identity/soul description.
        context:
          type: string
          nullable: true
          description: Agent orientation/system prompt text.
        skills:
          type: array
          description: Agent-level skills (fetch full content via getSkill).
          items:
            $ref: '#/components/schemas/ContextSkillIndex'

    ContextOrgRules:
      type: object
      required:
        - constitution_version
        - sections
      properties:
        constitution_version:
          type: string
          example: '5.0'
        sections:
          type: array
          description: |
            The six rule sections that define the organization's governance,
            each with its chosen rule variant (HOLACRACY, UNIVERSAL,
            CENTRALIZED, CUSTOM, EXISTING, MODULAR_ADOPTION_BY_CIRCLE) and
            the corresponding rich content text.
          items:
            $ref: '#/components/schemas/ContextOrgRuleSection'

    ContextOrgRuleSection:
      type: object
      required:
        - key
        - title
        - type
      properties:
        key:
          type: string
          enum:
            - preamble
            - org_struct
            - duties
            - tactical
            - power_shift
            - governance
          description: Stable key identifying the section.
        title:
          type: string
          description: Human-readable section title.
        type:
          type: string
          enum:
            - HOLACRACY
            - UNIVERSAL
            - CENTRALIZED
            - CUSTOM
            - EXISTING
            - MODULAR_ADOPTION_BY_CIRCLE
          description: Which rule variant the organization has adopted for this section.
        summary:
          type: string
          description: |
            Brief summary of the section. Present for HOLACRACY sections
            (from locale). Absent for other types.
        content:
          type: string
          nullable: true
          description: |
            Inline content for short sections. Present for
            UNIVERSAL/CENTRALIZED/CUSTOM when text is under 500 characters,
            and for MODULAR_ADOPTION_BY_CIRCLE. Null for EXISTING.
            Absent for HOLACRACY (use content_url instead).
        content_url:
          type: string
          format: uri
          description: |
            URL to fetch the full section text. Present for HOLACRACY
            sections and for UNIVERSAL/CENTRALIZED/CUSTOM sections with
            content >= 500 characters.
        mcp_tool:
          type: string
          description: |
            MCP tool name to fetch the full section text on demand.
            Present when content_url is present.

    OrgRuleDetail:
      type: object
      required:
        - key
        - title
        - type
        - content
      properties:
        key:
          type: string
          enum:
            - preamble
            - org_struct
            - duties
            - tactical
            - power_shift
            - governance
        title:
          type: string
        type:
          type: string
          enum:
            - HOLACRACY
            - UNIVERSAL
            - CENTRALIZED
            - CUSTOM
            - EXISTING
            - MODULAR_ADOPTION_BY_CIRCLE
        content:
          type: string
          nullable: true
          description: Full text of the section. Null for EXISTING.

    ContextRole:
      type: object
      required:
        - id
        - type
        - name
        - purpose
        - accountabilities
        - domains
        - skills
        - notes
        - projects
        - actions
      properties:
        id:
          type: string
          pattern: '^role_[0-9a-f]{32}$'
        type:
          type: string
          enum:
            - role
        name:
          type: string
          nullable: true
        purpose:
          type: string
          nullable: true
        accountabilities:
          type: array
          items:
            $ref: '#/components/schemas/Accountability'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/DomainRef'
        skills:
          type: array
          description: Role-level skills (fetch full content via getSkill).
          items:
            $ref: '#/components/schemas/ContextSkillIndex'
        notes:
          type: array
          description: Notes on this role (title and excerpt).
          items:
            $ref: '#/components/schemas/ContextIndexEntry'
        projects:
          type: array
          description: Projects assigned to this role.
          items:
            $ref: '#/components/schemas/ContextIndexEntry'
        actions:
          type: array
          description: Actions assigned to this role.
          items:
            $ref: '#/components/schemas/ContextIndexEntry'

    ContextParentRole:
      type: object
      nullable: true
      description: The parent role this role belongs to, with its policies (null for anchor roles).
      properties:
        id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
        name:
          type: string
          nullable: true
        purpose:
          type: string
          nullable: true
        policies:
          type: array
          description: Policies from this role and ancestor roles.
          items:
            $ref: '#/components/schemas/ContextIndexEntry'

    ContextSkillIndex:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          pattern: '^skill_[0-9a-f]{32}$'
        name:
          type: string

    ContextGovernance:
      type: object
      required:
        - org_rules
        - ancestor_roles
        - sibling_roles
      properties:
        org_rules:
          $ref: '#/components/schemas/ContextOrgRules'
        parent_role:
          $ref: '#/components/schemas/ContextParentRole'
        ancestor_roles:
          type: array
          description: Chain of ancestor roles up to the anchor role.
          items:
            $ref: '#/components/schemas/ContextIndexEntry'
        sibling_roles:
          type: array
          description: Other roles in the same parent role.
          items:
            $ref: '#/components/schemas/ContextIndexEntry'

    ContextIndexEntry:
      type: object
      description: |
        A generic index entry pointing to a resource. Used throughout the context
        response for progressive disclosure — each entry identifies a resource and
        optionally links to its full-detail endpoint.
      required:
        - type
        - name
      properties:
        id:
          type: string
          description: Resource ID (TypeID format when available).
        type:
          type: string
          description: Resource type (role, policy, note, skill, project, action).
        name:
          type: string
          description: Display name or title.
        purpose:
          type: string
          description: Role purpose (present for role-type entries).
        excerpt:
          type: string
          description: Brief content excerpt (present for policies and notes).
        status:
          type: string
          description: Status (present for projects and actions).
        url:
          type: string
          description: API URL for full resource detail (when a v5 endpoint exists).

    # -- Proposals (governance) --

    Proposal:
      type: object
      required:
        - id
        - type
        - status
        - available_transitions
        - changes
        - response_summary
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^prp_[0-9a-f]{32}$'
        type:
          type: string
          enum: [proposal]
        status:
          type: string
          enum:
            - draft
            - proposed_outside_meeting
            - escalated
            - accepted
            - draft_with_conflicts
          description: |
            Current AASM state. Draft is the initial state;
            `proposed_outside_meeting` is the shortcut-path circulation state;
            `escalated` is queued for live meeting; `accepted` is terminal.
        tension_id:
          type: string
          nullable: true
          pattern: '^ten_[0-9a-f]{32}$'
        circle_id:
          type: string
          nullable: true
          pattern: '^role_[0-9a-f]{32}$'
          description: |
            The `api_id` of the role that supports this proposal's circle.
            v5 is role-centric — circle references resolve to the circle's
            supported role.
        proposer_id:
          type: string
          nullable: true
          pattern: '^(per|agt)_[0-9a-f]{32}$'
        proposed_at:
          type: string
          nullable: true
          format: date-time
        response_deadline:
          type: string
          nullable: true
          format: date-time
        accepted_at:
          type: string
          nullable: true
          format: date-time
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ProposalChange'
        response_summary:
          type: object
          description: |
            Aggregate response counts. No per-person attribution is exposed —
            this is an intentional anti-political-pressure design decision to
            prevent back-channel pressure on whoever requested bring-to-meeting.
          required:
            - total
            - no_objection
            - bring_to_meeting
          properties:
            total:
              type: integer
              minimum: 0
              description: Total number of responses received.
            no_objection:
              type: integer
              minimum: 0
              description: Number of `no_objection` responses.
            bring_to_meeting:
              type: integer
              minimum: 0
              description: Number of `bring_to_meeting` responses.
        expected_response_count:
          type: integer
          minimum: 0
          description: |
            Number of circle members whose response is required for the
            proposal to auto-accept. Excludes the proposer and anyone added
            to the circle after `proposed_at`.
        received_response_count:
          type: integer
          minimum: 0
          description: |
            Number of expected responders who have submitted a response.
            When `received_response_count >= expected_response_count` and
            no responder has `bring_to_meeting`, the cron auto-accepts.
        available_transitions:
          type: array
          description: |
            Action names this caller may invoke on this proposal right now.
            Filtered by both current-state guards and caller authorization.
            Each name maps to a path: `POST /proposals/{id}/<name>`.
            Clients construct the URL — server returns names only.
          items:
            type: string
            enum: [propose, withdraw]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProposalChange:
      type: object
      description: |
        A governance command (create role, add accountability, remove domain,
        etc.). Shape varies by change type — `type` is always present; other
        keys are free-form based on the command's schema.

        Nested-only types (`CreateAccountability`, `UpdateAccountability`,
        `RemoveAccountability`, `CreateDomain`, `UpdateDomain`,
        `RemoveDomain`) must appear as children of `CreateRole` or
        `UpdateRole`, not as top-level proposal changes.
      required:
        - type
      properties:
        id:
          type: string
          description: Stable identifier for the change within the proposal.
        type:
          type: string
          description: Governance command type.
          enum:
            - CreateRole
            - UpdateRole
            - RemoveRole
            - CreateAccountability
            - UpdateAccountability
            - RemoveAccountability
            - CreateDomain
            - UpdateDomain
            - RemoveDomain
            - CreatePolicy
            - UpdatePolicy
            - RemovePolicy
            - CreateRoleNote
            - UpdateRoleNote
            - RemoveRoleNote
            - CreateLinkedRole
            - UpdateLinkedRole
            - MoveRole
            - MovePolicy
            - MoveItems
            - ElectRoleFiller
      additionalProperties: true

    ProposalVote:
      type: object
      description: |
        A governance vote on a proposal. No per-person attribution —
        summary stats only on the proposal resource.
      required:
        - id
        - type
        - proposal_status
        - value
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^prr_[0-9a-f]{32}$'
        type:
          type: string
          enum: [proposal_response]
        proposal_id:
          type: string
          nullable: true
          pattern: '^prp_[0-9a-f]{32}$'
        proposal_status:
          type: string
          description: |
            Current status of the parent proposal at the time of response.
            Useful when the response triggers auto-acceptance — the status
            will be `accepted` rather than `proposed_outside_meeting`.
          enum:
            - draft
            - proposed_outside_meeting
            - escalated
            - accepted
            - draft_with_conflicts
        value:
          type: string
          enum: [no_objection, bring_to_meeting]
          description: |
            * `no_objection` — willing to let the proposal pass as written.
            * `bring_to_meeting` — wants to discuss in a live governance
              meeting. Blocks auto-acceptance.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProposalRequest:
      type: object
      required:
        - proposal
      properties:
        proposal:
          type: object
          required:
            - tension_id
          properties:
            tension_id:
              type: string
              pattern: '^ten_[0-9a-f]{32}$'
            changes:
              type: array
              items:
                $ref: '#/components/schemas/ProposalChange'

    CreateProposalResponseRequest:
      type: object
      required:
        - response
      properties:
        response:
          type: object
          required:
            - value
          properties:
            value:
              type: string
              enum: [no_objection, bring_to_meeting]

    # -- Error --

    ProblemDetails:
      description: >-
        RFC 9457 Problem Details error object (backward-compatible successor to
        RFC 7807). All 4xx and 5xx responses from the API use this shape.
        Additional members may be present as RFC 9457 "extensions".
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type. Defaults to `about:blank`.
          example: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Not Found
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence.
          example: 404
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Not Found
        content_length:
          type: integer
          description: >-
            Extension member. Present on a 422 that rejects content for being too
            large. The size of the submitted content, in characters.
          example: 44364
        max_content_length:
          type: integer
          description: >-
            Extension member. Present on a 422 that rejects content for being too
            large. The size limit currently in effect, in characters.
          example: 40000
        limit_config_key:
          type: string
          description: >-
            Extension member. Present on a 422 that rejects content for being too
            large. Names the server configuration key that produced
            `max_content_length`, so a limit that looks wrong can be traced to the
            setting that set it.
          example: GLASSFROG_MCP_OUTPUT_TOKEN_CAP

    ContentSizeWarnings:
      type: array
      description: >-
        Warnings about the saved record. Present only when there is something to
        report. Currently used for content that saved successfully but is too large
        for an agent to read in one response. Each warning names the content size,
        the limit, and the configuration key that set the limit.
      items:
        type: string
      example:
        - "Note body is 52000 characters. Agents cannot read content over 40000 characters in one response (config: GLASSFROG_MCP_OUTPUT_TOKEN_CAP)."

  responses:
    BadRequest:
      description: >-
        The request was malformed — for example, `per_page` exceeds the maximum
        allowed value. The `detail` describes the specific issue.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: Not authorized to perform this action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: Resource not found or API v5 not enabled for this organization.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Conflict:
      description: |
        The request conflicts with the current state of the resource —
        for example, a business-rule violation or an ETag mismatch
        (resource modified since the `If-Match` value; re-fetch and retry).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    TooManyRequests:
      description: >-
        Rate limit exceeded. The `Retry-After` header indicates how many seconds
        to wait before retrying.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: "Rate limit exceeded. Try again in 42 seconds."

    UnprocessableEntity:
      description: Validation error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
