              - unprocessed
              - processed
              - archived
      responses:
        '200':
          description: A paginated list of tensions.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tension'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createTension
      summary: "Capture a tension about a role"
      description: |
        Captures a new tension. The requester is the sensing person
        (`sensed_by`); the path `role_id` is the sensing role (stored as
        `impacted_role_id` for historical reasons). Tensions captured this
        way are not bound to a meeting.
      parameters:
        - name: role_id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
      requestBody:
