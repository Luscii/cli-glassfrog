                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Domain'
                  meta:
                    type: object
                    required:
                      - pagination
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /domains/{id}:
    get:
      operationId: getDomain
      summary: "Get a domain"
      description: |
        Returns a single domain by its ID. Use `?include=policies` to embed
        policies scoped to this domain.
      parameters:
        - name: id
          in: path
          required: true
          description: The domain's unique identifier.
          schema:
            type: string
            pattern: '^dom_[0-9a-f]{32}$'
        - name: include
          in: query
          description: Comma-separated list of related resources to include.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - policies
      responses:
        '200':
          description: A single domain.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Domain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles/{role_id}/strategy:
    get:
      operationId: getRoleStrategy
      summary: "Get strategy for a role's circle"
      description: |
        Returns the strategy for the circle backing this role. If the circle
        has no strategy of its own, it inherits from the nearest ancestor
        circle that does — `inherited` will be `true` and
        `inherited_from_role_id` identifies the source.

        Returns 404 if the role does not expand into a circle.
      parameters:
        - name: role_id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
      responses:
        '200':
          description: The strategy for this circle.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Strategy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRoleStrategy
      summary: "Update strategy for a role's circle"
      description: |
        Sets or updates the strategy text for the circle backing this role.
        Requires circle admin or role-manage-without-proposal permission.
      parameters:
        - name: role_id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyInput'
      responses:
        '200':
          description: The updated strategy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Strategy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteRoleStrategy
      summary: "Clear strategy for a role's circle"
      description: |
        Removes the circle's own strategy. If a parent circle has a strategy,
        subsequent reads will show the inherited value. Requires circle admin
        or role-manage-without-proposal permission.
      parameters:
        - name: role_id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
      responses:
        '204':
          description: Strategy cleared successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles/{role_id}/notes:
    get:
      operationId: listRoleNotes
      summary: "List notes for a role"
      description: |
        Returns a paginated list of notes on a role. Notes include title,
        timestamps, and role reference. Use `GET /notes/{id}` for full content.
      parameters:
        - name: role_id
          in: path
          required: true
          description: The role's unique identifier.
          schema:
            type: string
            pattern: '^role_[0-9a-f]{32}$'
